<!-- Figures dinàmiques (fase 7c): converteix cada div .fig-dinamica en un navegador de passos.
     El div porta la figura estàtica (la seqüència sencera, clara i fosca) i data-passos, el nombre de
     fotogrames; els fotogrames són <nom>_pas<k>__<sufix>_{light,dark}.svg, al costat de l'estàtica, i
     la ruta se'n dedueix de la imatge estàtica, perquè el lloc es pot publicar en un subdirectori.
     Sense JavaScript, es veu la figura estàtica. Ho genera 25_scripts/gen_MC.py (fotogrames = true). -->
<script>
(function () {
  function inicia(fig) {
    var n = parseInt(fig.getAttribute('data-passos'), 10);
    var plantilla = {};
    fig.querySelectorAll('img').forEach(function (im) {
      var m = (im.getAttribute('src') || '').match(/^(.*)__([A-Za-z]+)_(light|dark)\.svg$/);
      if (m) plantilla[m[3]] = [m[1], m[2], im.getAttribute('alt') || ''];
    });
    if (!n || !plantilla.light) return;
    var estatic = document.createElement('div');
    while (fig.firstChild) estatic.appendChild(fig.firstChild);
    estatic.hidden = true;
    var vista = document.createElement('div');
    var capes = {};
    ['light', 'dark'].forEach(function (v) {
      if (!plantilla[v]) return;
      var d = document.createElement('div');
      d.className = v + '-content';
      var im = document.createElement('img');
      im.style.width = '100%';
      d.appendChild(im);
      vista.appendChild(d);
      capes[v] = im;
    });
    var ctl = document.createElement('div');
    ctl.className = 'fig-dinamica-controls';
    function boto(text, etiqueta) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-sm btn-outline-secondary';
      b.textContent = text;
      b.setAttribute('aria-label', etiqueta);
      ctl.appendChild(b);
      return b;
    }
    var bInici = boto('⏮', 'Estat inicial');
    var bAnt = boto('◀ Anterior', 'Pas anterior');
    var rotul = document.createElement('span');
    rotul.className = 'fig-dinamica-pas';
    rotul.setAttribute('aria-live', 'polite');
    ctl.appendChild(rotul);
    var bSeg = boto('Següent ▶', 'Pas següent');
    var bTot = boto('Veure-ho tot', 'Veure tota la seqüència');
    var k = 0;
    function mostra() {
      Object.keys(capes).forEach(function (v) {
        capes[v].src = plantilla[v][0] + '_pas' + k + '__' + plantilla[v][1] + '_' + v + '.svg';
        capes[v].alt = (k === 0 ? 'Estat inicial. ' : 'Accés ' + k + '. ') + plantilla[v][2];
      });
      rotul.textContent = k === 0 ? 'Estat inicial' : 'Accés ' + k + ' de ' + (n - 1);
      bInici.disabled = bAnt.disabled = (k === 0);
      bSeg.disabled = (k === n - 1);
    }
    bInici.onclick = function () { k = 0; mostra(); };
    bAnt.onclick = function () { if (k > 0) { k--; mostra(); } };
    bSeg.onclick = function () { if (k < n - 1) { k++; mostra(); } };
    bTot.onclick = function () {
      var tot = estatic.hidden;
      estatic.hidden = !tot;
      vista.hidden = tot;
      [bInici, bAnt, bSeg, rotul].forEach(function (e) { e.hidden = tot; });
      bTot.textContent = tot ? 'Pas a pas' : 'Veure-ho tot';
    };
    fig.appendChild(ctl);
    fig.appendChild(vista);
    fig.appendChild(estatic);
    mostra();
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.fig-dinamica').forEach(inicia);
  });
})();
</script>
