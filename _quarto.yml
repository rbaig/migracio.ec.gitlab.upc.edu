project:
  type: book
  output-dir: _book
  pre-render:
    - bash -c "rm -rf auto_figs && mkdir auto_figs"
    - 25_scripts/norm_font.py 24_specs/svg.md "^22_figs_originals/[^/]+[.]svg" "__original_light" --output-dir="auto_figs/"
    - 25_scripts/norm_font.py 24_specs/svg.md "^23_figs_externes/[^/]+[.]svg"  "__extern_light"   --output-dir="auto_figs/"
    - 25_scripts/gen_regs.py  24_specs/registres.toml                         "__registre_light" --output-dir="auto_figs/"
    - 25_scripts/gen_BA.py    24_specs/BA.toml                                "__BA_light"       --output-dir="auto_figs/"
    - 25_scripts/gen_mapa.py  24_specs/mapa.toml                              "__mapa_light"     --output-dir="auto_figs/"
    - 25_scripts/gen_subrutines.py 24_specs/subrutines.toml                   "__subrutina_light" --output-dir="auto_figs/"
    - 25_scripts/gen_MC.py    24_specs/MC.toml                                "__MC_light"       --output-dir="auto_figs/"
    - 25_scripts/gen_memoria.py 24_specs/memoria.toml                         "__memoria_light"  --output-dir="auto_figs/"
    - 25_scripts/gen_crops.py 24_specs/retalls.toml "auto_figs/"                                  --output-dir="auto_figs/"
    - 25_scripts/gen_dark.py  24_specs/svg.md "auto_figs/[^/]+_light[.]svg"                      --output-dir="auto_figs/"

