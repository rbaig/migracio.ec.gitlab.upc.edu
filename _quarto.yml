lang: ca

language:
  crossref-nte-prefix: "RISC-V"         ## `-prefix` Text afegit per Quarto en les referències creuada; e.g. @nte-mult -> "RISC-V 4.1."
  callout-note-title: "RISC-V"          ## `-title` Títol del caption dins del bloc; el del PDF; e.g. "RISC-V 4.1."
  crossref-tip-prefix: "Exemple"
  callout-tip-title: "Exemple"
  crossref-cau-prefix: "Essencial"
  callout-caution-title: "Essencial"
  crossref-wrn-prefix: "Aprofundiment"
  callout-warning-title: "Aprofundiment"
  crossref-imp-prefix: "EC"
  callout-important-title: "EC"
  crossref-sol-prefix: "Solució"         ## referències @sol-: l'idioma català de Quarto no el defineix, i al PDF sortia «Solution»

crossref:
  fig-prefix: "Figura"
  fig-title: "Figura"
  tbl-prefix: "Taula"
  tbl-title: "Taula"
  lst-prefix: "Codi"
  lst-title: "Codi"
  thm-prefix: "Algorisme"
  thm-title: "Algorisme"

filters:
  - 25_scripts/figures.lua   # alt de les figures des del <desc> de l'SVG i amplada a l'HTML (fase 7c, bloc 12)
  - path: 25_scripts/titols_pdf.lua   # marcadors del PDF amb els títols curts del menú de l'HTML («A1 Introducció»)
    at: post-quarto                   # després de resoldre {{< var temaN >}}: abans, el títol encara és el shortcode
  - 25_scripts/versio.lua      # hash del commit renderitzat després de la data de publicació (HTML i PDF)
  - 25_scripts/espai_unitats.lua   # espai que no es parteix entre un nombre i la seva unitat o el % (D-87)
  - path: 25_scripts/plegables.lua  # exemples i solucions plegables a l'HTML (pilot de T1, D-90)
    at: pre-ast                     # abans que Quarto converteixi els #exr- en nodes propis i del crossref, que ha de resoldre la remissió a la solució

format:
  html:
    include-before-body:
      - text: |
          <div class="sidebar-institucional">
            <a href="https://dac.upc.edu" target="_blank">Departament d'Arquitectura de Computadors (DAC)</a><br>
            <a href="https://www.upc.edu" target="_blank">Universitat Politècnica de Catalunya (UPC)</a>
          </div>
    include-after-body:
      - figures_dinamiques.html   # navegador de passos de les figures .fig-dinamica (gen_MC.py, fotogrames = true)
      - formules_en_linia.html    # desplaçament horitzontal només per a les fórmules en línia que no caben (styles.css)
    # include-after-body:
    # - text: |
    #     <script>
    #     document.querySelectorAll('.header-section-number').forEach(el => {
    #       el.textContent = el.textContent.replace(/^\d+\./, '');
    #     });
    #     document.querySelectorAll('a[href*="#sec-"]').forEach(el => {
    #       el.textContent = el.textContent.replace(/^(Secció|Tema|Sessió|Figura|Taula|Algorisme)\s+\d+\./, '$1 ');
    #     });
    #     </script>
#    subtitle: "Grau en Enginyeria Informàtica (GEI) <br> Facultat d'informàtica de Barcelona (FIB) <br> Universitat politècnica de Catalunya (UPC)"
    resources:
      - styles.css          # Cal afegir-lo a `resources:` explícitament
      - auto_figs/*_pas[0-9]*.svg   # fotogrames de les figures dinàmiques: només els cita figures_dinamiques.html
#    embed-resources: true  # Incrusta els fitxers de recursos (imatges, fitxers inclosos, etc.) dins del fitxer HTML per evitar problemes de rutes relatives (per exemple, quan es visualitza el fitxer HTML directament des del sistema de fitxers, sense un servidor web)
    # format-links: [pdf]     # Botó a la barra superior (navbar) per descarregar el PDF
    highlight-style: a11y   # Accessibilitat: Ressaltat de codi adaptatiu
    syntax-definitions:
      - 24_specs/riscv.xml  # ressaltat propi de RISC-V i RARS per als blocs .s (13_contrib.qmd §Blocs de codi)
    respect-user-color-scheme: true   # light/dark: per defecte el del sistema
    css:
      - styles.css          # Cal afegir-lo a `resources:` explícitament
    theme:                  # Activació commutador light/dark
      light: 
        - cosmo             # https://github.com/quarto-dev/quarto-cli/tree/main/src/resources/formats/html/bootstrap/themes
        - custom_light.scss
        - custom.scss
      dark:
        - darkly            # cyborg
        - custom_dark.scss
        - custom.scss
    code-line-numbers: true
    code-copy: true         # Icona de "copiar al porta papers"
    number-sections: false  # `left`: Amaga numeració (activada individualment a cada capítol); el comptatge continua encara que no els mostri al `left` ("Presentació" vs. "1 Presentació"); default: `false`
    code-overflow: wrap     # Opcions: `scroll` / `wrap` https://quarto.org/docs/output-formats/html-code.html#code-overflow
    code-fold: true         # https://quarto.org/docs/output-formats/html-code.html#code-tools Permet plegar blocs de codi llargs (més de 20 línies) per millorar la llegibilitat, especialment en dispositius mòbils
    code-tools: true        # Mostra botó `</> Codi` dalt-dreta per mostrar el codi per poder fer C&P https://quarto.org/docs/output-formats/html-code.html#code-tools
    toc: true
    toc-location: left      # "Taula de continguts" a `left`
    page-layout: full       # Estén el frame central sobre el dret (per aprofitar l'espai que deixa `toc-location: left`)
  pdf:
    documentclass: scrbook  # KOMA: `scrartcl` (~10 pàg.), `scrreport` (~50 pàg.), `scrbook` (+50 pàg.)
    classoption: oneside    # KOMA: `oneside`, `twoside`
    papersize: a4           # KOMA: `a4` (default), `letter`
    geometry:
      - top=1.5cm
      - bottom=1cm
      - left=2cm
      - right=2cm
      - includeheadfoot
      - footskip=1cm
    fontsize: 11pt
    monofont: "DejaVu Sans Mono"   # cobertura Unicode als blocs de codi (─, ✓, «—»); Latin Modern Mono no en té (TODO.md, «Font monoespaiada del PDF»)
    monofontoptions:
      - Scale=MatchLowercase
    number-sections: true
    keep-tex: true          # Conserva el fitxer .tex generat per Pandoc
    colorlinks: true        # Activa el color en els enllaços (per defecte són vermells)
    urlcolor: blue          # Color per als enllaços web
    linkcolor: blue         # Color per als enllaços internals (índex, seccions, etc.)
    citecolor: blue         # Color per a les cites bibliogràfiques
    link-citations: true    # Enllaços a les cites bibliogràfiques (per defecte només hi ha el número de la cita)
    include-in-header:
      - preamble.tex
    syntax-definitions:
      - 24_specs/riscv.xml  # el mateix ressaltat que a l'HTML
    language:               # «⁂» → \exercisename a preamble.tex: «Problema» o «Exercici» segons la part (13_contrib.qmd §Problemes i solucions)
      crossref-exr-title: "⁂"
      crossref-exr-prefix: "⁂"

bibliography: 15_bibliografia.bib
csl: ieee.csl
