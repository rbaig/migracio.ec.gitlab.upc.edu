<polygon points="66,132 73.4,128.9 73.4,135.1" fill="#343a40"/>
<text x="138" y="126" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">dada</text>
<polyline points="318,102 318,186 66,186" fill="none" stroke="#198754" stroke-width="1.5" stroke-linejoin="round"/>
