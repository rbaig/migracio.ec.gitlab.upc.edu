<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Memòria cau indexada i etiquetada virtualment (VIVT)</title>
<desc>Com la figura 7.11 (esquerra) del tema antic. A l'esquerra, la CPU; a la dreta, l'MP, en verd. La CPU dona l'adreça lògica: l'índex i el desplaçament van a l'MC, en blau, i l'etiqueta, a un comparador dins de l'MC. De l'MC tornen a la CPU la dada i el senyal d'encert. Només en una fallada l'MC envia l'adreça lògica al TLB, en groc, que en dona l'adreça física per a l'MP, i l'MP en torna el bloc a l'MC. A sota, el cronograma: amb un encert, només l'accés a l'MC.</desc>
<rect x="20" y="20" width="44" height="180" rx="4" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/><text x="42.0" y="114.33333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#6c757d" text-anchor="middle" font-weight="bold">CPU</text>
<rect x="616" y="20" width="44" height="180" rx="4" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="638.0" y="114.33333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#0a3622" text-anchor="middle" font-weight="bold">MP</text>
<rect x="210" y="70" width="130" height="100" rx="4" fill="#cfe2ff" stroke="#084298" stroke-width="1"/>
<text x="262" y="140" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#084298" text-anchor="middle" font-weight="bold">MC</text>
<rect x="424" y="70" width="80" height="40" rx="4" fill="#fff3cd" stroke="#664d03" stroke-width="1"/><text x="464.0" y="94.33333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#664d03" text-anchor="middle" font-weight="bold">TLB</text>
<polyline points="64,44 318,44 318,82" fill="none" stroke="#343a40" stroke-width="1.5" stroke-linejoin="round"/>
<text x="84" y="38" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="start">adreça lògica</text>
