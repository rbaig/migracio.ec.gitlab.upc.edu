<text x="381" y="84" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">adreça lògica</text>
<text x="381" y="104" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle" font-style="italic">en una fallada</text>
