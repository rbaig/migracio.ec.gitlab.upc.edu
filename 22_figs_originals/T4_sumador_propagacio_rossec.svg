<svg width="750" height="265" viewBox="0 0 750 265" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sumador amb propagació del ròssec i detecció del sobreeiximent (mode clar)</title>
<desc>Cadena de n sumadors complets, del bit de més pes (n-1, a l'esquerra) al de menys pes (0, a la dreta). Cada sumador complet rep a_i, b_i i el ròssec c_i del sumador de la seva dreta, i dona s_i i el ròssec c_(i+1) al de la seva esquerra. Una porta XOR rep el ròssec d'entrada c_(n-1) i el de sortida c_n del darrer sumador i dona el bit de sobreeiximent v.</desc>
