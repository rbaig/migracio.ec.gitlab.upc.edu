<title>Temps de cicle de dos dissenys</title>
<desc>Dos diagrames de temps amb dues etapes, A i B, de durades diferents, i les marques del temps de cicle. A dalt, el disseny inicial: el temps de cicle tc és el de l'etapa més llarga, B, i A acaba abans. A sota, un disseny amb un temps de cicle tc' més curt que B: A hi cap en un cicle, però B en necessita dos, i acaba a 2tc'.</desc>
