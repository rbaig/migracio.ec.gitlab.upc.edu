<svg width="100%" viewBox="0 0 680 256" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pàgines i marcs de pàgina</title>
<desc>A l'esquerra, les pàgines VPN 0 i VPN 1 del procés 1, en blau, i del procés 2, en verd, amb punts suspensius per a la resta. A la dreta, la memòria física, amb quatre marcs, de PPN 0 a PPN 3, i el disc a sota. Les fletxes assignen VPN 0 del procés 1 a PPN 1, VPN 0 del procés 2 a PPN 0 i VPN 1 del procés 2 a PPN 2; PPN 3 és lliure. VPN 1 del procés 1 no és a la memòria física: una fletxa discontínua la porta al disc, on és l'única pàgina dibuixada.</desc>
<text x="145" y="26" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle" font-weight="bold">Procés 1</text>
<rect x="95" y="36" width="100" height="26" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="145.0" y="53.166666666666664" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#084298" text-anchor="middle">VPN 0</text>
<rect x="95" y="62" width="100" height="26" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="145.0" y="79.16666666666667" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#084298" text-anchor="middle">VPN 1</text>
<text x="145" y="104" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">⋮</text>
<text x="145" y="146" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#0a3622" text-anchor="middle" font-weight="bold">Procés 2</text>
<rect x="95" y="156" width="100" height="26" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="145.0" y="173.16666666666666" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#0a3622" text-anchor="middle">VPN 0</text>
<rect x="95" y="182" width="100" height="26" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="145.0" y="199.16666666666666" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#0a3622" text-anchor="middle">VPN 1</text>
<text x="145" y="224" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">⋮</text>
<text x="485" y="26" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#343a40" text-anchor="middle" font-weight="bold">Memòria física</text>
<rect x="435" y="36" width="100" height="26" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="485.0" y="52.833333333333336" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#0a3622" text-anchor="middle">P2 · VPN 0</text>
<text x="543" y="53" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="10" fill="#6c757d" text-anchor="start">PPN 0</text>
<rect x="435" y="62" width="100" height="26" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="485.0" y="78.83333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#084298" text-anchor="middle">P1 · VPN 0</text>
<text x="543" y="79" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="10" fill="#6c757d" text-anchor="start">PPN 1</text>
