<text x="543" y="105" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="10" fill="#6c757d" text-anchor="start">PPN 2</text>
<rect x="435" y="114" width="100" height="26" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
<text x="485" y="131" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle" font-style="italic">lliure</text>
<text x="543" y="131" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="10" fill="#6c757d" text-anchor="start">PPN 3</text>
