<rect x="160" y="346" width="90" height="18" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="205.0" y="358.8333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#084298" text-anchor="middle">MC</text>
<rect x="250" y="336" width="24" height="18" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/><text x="262.0" y="349.1666666666667" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle">=</text>
