<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Memòria cau indexada virtualment i etiquetada físicament (VIPT)</title>
<desc>La CPU genera l'adreça lògica, dividida en VPN i desplaçament. Dos camins en paral·lel: a dalt, els bits del desplaçament indexen la MC, en blau, que en llegeix les etiquetes i les dades; a sota, el VPN va al TLB, en groc, que dona el PPN. Un comparador, a la dreta, confronta l'etiqueta llegida de la MC amb el PPN: si coincideixen, encert, i en surt la dada; si no, fallada, i s'accedeix a la MP, en verd. A sota, el cronograma: el TLB i la MC alhora, i després la comparació.</desc>
<rect x="20" y="106" width="70" height="48" rx="4" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/><text x="55.0" y="134.33333333333334" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#6c757d" text-anchor="middle" font-weight="bold">CPU</text>
<line x1="90" y1="130" x2="128" y2="130" stroke="#343a40" stroke-width="1.2"/>
<polygon points="128,130 120.6,133.1 120.6,126.9" fill="#343a40"/>
<text x="230" y="110" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">adreça lògica</text>
<rect x="130" y="117" width="100" height="26" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/><text x="180.0" y="134.16666666666666" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="11" fill="#343a40" text-anchor="middle">VPN</text>
<rect x="230" y="117" width="100" height="26" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/><text x="280.0" y="134.16666666666666" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle">desplaçament</text>
<rect x="400" y="30" width="100" height="60" rx="4" fill="#cfe2ff" stroke="#084298" stroke-width="1"/>
<text x="450" y="58" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#084298" text-anchor="middle" font-weight="bold">MC</text>
<text x="450" y="70" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="9" fill="#084298" text-anchor="middle">(etiquetes i dades)</text>
<rect x="400" y="176" width="100" height="48" rx="4" fill="#fff3cd" stroke="#664d03" stroke-width="1"/><text x="450.0" y="204.33333333333334" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#664d03" text-anchor="middle" font-weight="bold">TLB</text>
<polyline points="280,117 280,60 398,60" fill="none" stroke="#343a40" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="398,60 390.6,63.1 390.6,56.9" fill="#343a40"/>
<text x="286" y="92" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="start">índex</text>
