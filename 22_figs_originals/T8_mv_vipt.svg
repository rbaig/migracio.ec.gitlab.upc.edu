<polygon points="398,200 390.6,203.1 390.6,196.9" fill="#343a40"/>
<text x="186" y="176" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="start">VPN</text>
