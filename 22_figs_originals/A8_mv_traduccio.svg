<svg width="100%" viewBox="0 0 680 218" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Traducció d'una adreça lògica a una adreça física</title>
<desc>A dalt, l'adreça lògica de 32 bits, amb els números de bit de 31 a 0: el VPN ocupa els 20 bits de més pes i el desplaçament els 12 de menys pes. El VPN entra a un bloc de traducció, que en treu el PPN, de 2 bits; el desplaçament baixa sense canvis. A sota, l'adreça física de 14 bits: el PPN i el mateix desplaçament, amb els números de bit de 13 a 0.</desc>
<text x="150" y="60.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#343a40" text-anchor="end" font-weight="bold">Adreça lògica</text>
