<svg width="100%" viewBox="0 0 680 278" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pàgines i marcs de pàgina</title>
<desc>A banda i banda, l'espai lògic de dos processos, de 0x00000000 a 0xFFFFFFFF, amb l'adreça inicial i final de cada pàgina de 4 KiB; el procés 1, en blau, i el procés 2, en verd, fan servir VPN 0 i VPN 1 cadascun. Al centre, la memòria física de 16 KiB, amb quatre marcs de 0x0000 a 0x3FFF i els seus PPN: PPN 0 conté VPN 0 del procés 2, PPN 1 conté VPN 0 del procés 1, PPN 2 conté VPN 1 del procés 2 i PPN 3 és lliure. A sota, el disc, amb VPN 1 del procés 1, que no és a la memòria física i hi arriba amb una fletxa discontínua que baixa per l'esquerra de la memòria.</desc>
<text x="155" y="22" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle" font-weight="bold">Procés 1</text>
<text x="155" y="36" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle" font-style="italic">espai lògic</text>
