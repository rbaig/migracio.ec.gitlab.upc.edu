<svg width="100%" viewBox="0 0 680 366" xmlns="http://www.w3.org/2000/svg" role="img">
<title>La taula de pàgines</title>
<desc>A dalt, l'adreça lògica de 32 bits: VPN, de 20 bits, i desplaçament, de 12. El registre de taula de pàgines, a l'esquerra, apunta a l'adreça base de la taula de pàgines, que té 2 elevat a 20 entrades, de 0 a 2 elevat a 20 menys 1, amb columnes V, D, E i PPN. El VPN fa d'índex i selecciona una entrada, destacada en blau. Del bit V de l'entrada surt una anotació: si és 0, la pàgina no és a la memòria física; si és 1, hi és. El PPN de l'entrada baixa fins a l'adreça física, de 14 bits, on s'ajunta amb el desplaçament de l'adreça lògica, que es conserva.</desc>
<text x="190" y="59.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#343a40" text-anchor="end" font-weight="bold">Adreça lògica</text>
