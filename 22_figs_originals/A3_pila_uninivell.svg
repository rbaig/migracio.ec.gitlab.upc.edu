<title>Evolució de sp en una crida a una funció fulla</title>
<desc>El codi de funcB, que executa sentB. A sota, tres columnes de la pila, d'adreces baixes a altes, amb la posició de sp marcada en vermell: abans de cridar funcB; mentre s'executa sentB, amb sp més amunt i el BA de funcB, en groc, entre sp i la posició anterior; i després de retornar de funcB, amb sp a la posició inicial.</desc>
