  <!-- CAPA 1: TEXT DEL CODI -->
  <text
     font-family="'Liberation Mono', 'Courier New', Courier, monospace"
     font-size="12px"
     fill="#343a40"
     id="text10"
     x="-8"
     y="-4"><tspan
       x="6"
       y="18"
       id="tspan2">char exemple(int a, int b, int c ) {</tspan><tspan
       x="34.799999"
       y="36"
       id="tspan3">int d, e, q;</tspan><tspan
       x="34.799999"
       y="54"
       id="tspan4">char v[18], w[20];</tspan><tspan
       x="34.799999"
       y="72"
       id="tspan5">d = a + b;</tspan><tspan
       x="34.799999"
       y="93"
       id="tspan6">res_f = f(d, &amp;q);</tspan><tspan
       x="34.799999"
       y="124"
       id="tspan7">res_g = g(v, w);</tspan><tspan
       x="34.799999"
       y="145"
       id="tspan8">e = res_g + res_f;</tspan><tspan
       x="34.799999"
       y="159"
       id="tspan9">return v[ e + q] + w[ d + c ];</tspan><tspan
       x="6"
       y="173"
       id="tspan10">}</tspan></text>
  <!-- CAPA 2: FRONTERES DE CRIDA -->
  <text
     x="246"
     y="94.984627"
     font-size="10px"
     font-style="italic"
     fill="#6c757d"
     id="text11">anterior a res_f</text>
  <text
     x="246"
     y="109.98463"
     font-size="10px"
     font-style="italic"
     fill="#6c757d"
     id="text12">posterior a res_f</text>
  <text
     x="264"
     y="127.3282"
     font-size="10px"
     font-style="italic"
     fill="#6c757d"
     id="text13"><tspan
