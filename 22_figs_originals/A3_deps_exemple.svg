<title>Dependències de dades de la funció exemple, amb fletxes</title>
<desc>El codi de la funció exemple(int a, int b, int c), amb línies de punts a les crides a f i a g, i els rètols «anterior a» i «posterior a» de cada crida. Dues fletxes blaves porten de l'escriptura de d (d = a + b) i del paràmetre c fins al seu ús a la darrera línia, w[d + c], després de totes dues crides; una fletxa vermella porta de res_f, el resultat de la crida a f, fins al seu ús després de la crida a g.</desc>
