<title>Evolució de sp en una crida multinivell</title>
<desc>El codi de funcA, que executa sentA1, crida funcB i executa sentA2, i el de funcB, que executa sentB. A sota, cinc columnes de la pila, d'adreces baixes a altes, amb la posició de sp marcada en vermell: abans de cridar funcA; mentre s'executa sentA1, amb el BA de funcA, en blau; mentre s'executa sentB, amb el BA de funcB, en groc, a sobre del de funcA; mentre s'executa sentA2, de nou només amb el de funcA; i després de retornar de funcA, amb sp a la posició inicial.</desc>
