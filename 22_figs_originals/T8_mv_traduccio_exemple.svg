<svg width="100%" viewBox="0 0 680 322" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Exemple de traducció d'una adreça amb la taula de pàgines</title>
<desc>Traducció de l'adreça lògica 0x00001801 amb la taula de pàgines del procés 2. A dalt, l'adreça en binari: VPN 0000 0000 0000 0000 0001, és a dir, 1, i desplaçament 1000 0000 0001. El registre de taula de pàgines apunta a la base de la taula, amb columnes V, D, E i PPN: l'entrada 0 té V = 1 i PPN 00, l'entrada 1, destacada en blau, té V = 1 i PPN 10, i la darrera, 2 elevat a 20 menys 1, té V = 0. El VPN 1 selecciona l'entrada 1; el seu bit V = 1 indica que la pàgina és a la memòria física, i el seu PPN, 10, baixa a l'adreça física, on s'ajunta amb el desplaçament 1000 0000 0001: l'adreça física és 0x2801.</desc>
