<svg width="100%" viewBox="0 0 680 414" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Espais d'adreçament lògic i físic</title>
<desc>A banda i banda, l'espai lògic de dos processos, cadascun de 0x00000000 a 0xFFFFFFFF, amb poques pàgines en ús: A, B i C del procés 1 i X i Y del procés 2. Totes dues columnes envien adreces lògiques a la MMU, al centre, que en tradueix cadascuna en una adreça física. A sota de la MMU, la memòria física, més petita, té set marcs: A, Y, B i X ocupen quatre marcs, en un ordre que no és el dels espais lògics, i tres són lliures. A sota, el disc conté les cinc pàgines; C només hi és al disc.</desc>
<text x="105" y="20" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle" font-weight="bold">Procés 1</text>
<text x="105" y="34" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle" font-style="italic">espai lògic</text>
<text x="105" y="50" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="10" fill="#6c757d" text-anchor="middle">0x00000000</text>
<text x="105" y="310" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="10" fill="#6c757d" text-anchor="middle">0xFFFFFFFF</text>
<rect x="60" y="56" width="90" height="240" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
<rect x="60" y="76" width="90" height="20" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="105.0" y="90.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle">A</text>
<rect x="60" y="146" width="90" height="20" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="105.0" y="160.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle">B</text>
<rect x="60" y="236" width="90" height="20" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="105.0" y="250.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle">C</text>
<text x="575" y="20" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#0a3622" text-anchor="middle" font-weight="bold">Procés 2</text>
