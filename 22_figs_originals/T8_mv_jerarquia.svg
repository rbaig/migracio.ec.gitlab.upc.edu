<svg width="100%" viewBox="0 0 680 264" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Jerarquia de memòria en un computador amb memòria virtual</title>
<desc>Piràmide de quatre nivells, de dalt a baix: registres, memòria cau (SRAM), memòria principal (DRAM) i disc (SSD). A la dreta de cada nivell, el temps d'accés orientatiu: 0,25 ns, de 0,5 a 5 ns, de 50 a 100 ns i de 0,05 a 0,1 ms. A l'esquerra, una fletxa vertical: cap amunt, els nivells són més propers, ràpids, cars i petits; cap avall, més llunyans, lents, barats i grans.</desc>
<polygon points="300,20 343.15999999999997,72 256.84000000000003,72" fill="#cfe2ff" stroke="#084298" stroke-width="1"/>
<text x="300" y="56.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle" font-weight="bold">Regs.</text>
<text x="538.6" y="50.0" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="11" fill="#343a40" text-anchor="start">~0,25 ns</text>
<line x1="351.15999999999997" y1="46.0" x2="530.6" y2="46.0" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>
<polygon points="253.52,76 346.48,76 389.64,128 210.36,128" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/>
<text x="300" y="106.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#0a3622" text-anchor="middle" font-weight="bold">Memòria cau (SRAM)</text>
<text x="538.6" y="106.0" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="11" fill="#343a40" text-anchor="start">0,5 – 5 ns</text>
<line x1="397.64" y1="102.0" x2="530.6" y2="102.0" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>
<polygon points="207.04000000000002,132 392.96,132 436.12,184 163.88,184" fill="#fff3cd" stroke="#664d03" stroke-width="1"/>
<text x="300" y="162.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#664d03" text-anchor="middle" font-weight="bold">Memòria principal (DRAM)</text>
<text x="538.6" y="162.0" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="11" fill="#343a40" text-anchor="start">50 – 100 ns</text>
<line x1="444.12" y1="158.0" x2="530.6" y2="158.0" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>
<polygon points="160.56,188 439.44,188 482.6,240 117.4,240" fill="#f8d7da" stroke="#842029" stroke-width="1"/>
<text x="300" y="218.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#842029" text-anchor="middle" font-weight="bold">Disc (SSD)</text>
<text x="538.6" y="218.0" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="11" fill="#343a40" text-anchor="start">0,05 – 0,1 ms</text>
<line x1="490.6" y1="214.0" x2="530.6" y2="214.0" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>
<text x="538.6" y="16" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="start" font-style="italic">temps d'accés</text>
<line x1="60" y1="240" x2="60" y2="28" stroke="#6c757d" stroke-width="1"/>
<polygon points="60,20 56,32 64,32" fill="#6c757d"/>
<text x="86" y="42" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">proper</text>
<text x="86" y="56" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">ràpid</text>
<text x="86" y="70" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">car</text>
<text x="86" y="84" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">petit</text>
<text x="86" y="184" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">llunyà</text>
<text x="86" y="198" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">lent</text>
<text x="86" y="212" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">barat</text>
<text x="86" y="226" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">gran</text>
