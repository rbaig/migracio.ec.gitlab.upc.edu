<svg width="100%" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Espais d'adreçament lògic i físic</title>
<desc>A banda i banda, l'espai lògic de dos processos, de 0x00000000 a 0xFFFFFFFF, amb l'adreça inicial i final de cada pàgina de 4 KiB: el procés 1, en blau, usa les pàgines A (0x00000000) i B (0x00001000) i la darrera, C (0xFFFFF000); el procés 2, en verd, usa X (0x00000000) i Y (0x00001000). Les dues columnes envien adreces lògiques a l’MMU, al centre, que les tradueix a adreces físiques. A sota, la memòria física de 16 KiB, amb quatre marcs: X a 0x0000, A a 0x1000, Y a 0x2000 i C a 0x3000, en un ordre que no és el dels espais lògics. A sota, el disc, amb la pàgina B, que no és a la memòria física i hi arriba amb una fletxa discontínua.</desc>
