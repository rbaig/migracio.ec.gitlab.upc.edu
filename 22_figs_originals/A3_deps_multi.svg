  </defs>
  <!-- CAPA 1: TEXT (x absolut per a cada tspan, text sense espais duplicats) -->
  <text
     font-family="'Liberation Mono', 'Courier New', Courier, monospace"
     font-size="12px"
     fill="#343a40"
     id="text7"
     x="-6"
     y="-4"><tspan
       x="8"
       y="18"
       id="tspan2">int multi(int a, int b, int c ) {</tspan><tspan
       x="36.799999"
       y="36"
       id="tspan3">int d, e;</tspan><tspan
       x="36.799999"
       y="54"
       id="tspan4">d = a + b;</tspan><tspan
       x="36.799999"
       y="88"
       id="tspan5">e = mcm(c, d);</tspan><tspan
       x="36.799999"
       y="122"
       id="tspan6">return c + d + e;</tspan><tspan
       x="8"
       y="140"
       id="tspan7">}</tspan></text>
  <!-- CAPA 2: FRONTERA DE CRIDA -->
  <line
     x1="8.6175766"
     y1="68"
     x2="54.617577"
     y2="68"
