     font-size="10px"
     font-style="italic"
     fill="#6c757d"
     id="text8">codi anterior a la crida</text>
  <text
     x="174"
     y="114"
     font-size="10px"
     font-style="italic"
     fill="#6c757d"
     id="text9">codi posterior a la crida</text>
  <!-- CAPA 3: FLETXES -->
  <!-- c (blau): signatura → return c -->
  <!-- d (blau): d=a+b → return d -->
  <!-- e (negre): e=mcm → return e -->
