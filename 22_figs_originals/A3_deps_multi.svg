<title>Dependències de dades de la funció multi, amb fletxes</title>
<desc>El codi de la funció multi(int a, int b, int c). Una línia de punts separa el codi anterior a la crida e = mcm(c, d) del posterior. Dues fletxes blaves porten del paràmetre c i de l'escriptura de d (d = a + b) fins al seu ús a return c + d + e, després de la crida.</desc>
