<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="610"
   height="212"
   viewBox="0 0 610 212"
   font-family="'Liberation Sans', Arial, Helvetica, sans-serif"
   role="img"
   version="1.1"
   id="svg19"
   sodipodi:docname="T3_compilacio_separada.svg"
   inkscape:version="1.4 (e7c3feb100, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview19"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="4.795082"
     inkscape:cx="208.12991"
     inkscape:cy="105.94188"
     inkscape:window-width="3072"
     inkscape:window-height="1659"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg19" />
  <title
     id="title1">Flux de compilació separada (mode clar)</title>
  <desc
     id="desc1">Diagrama que mostra el flux de compilació separada: p1.c i p9.c es compilen i assemblen independentment generant p1.o i p9.o, que l'enllaçador (ld) combina amb lib.a per produir l'executable.</desc>
  <defs
     id="defs1">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 2,1 8,5 2,9"
         fill="none"
         stroke="#6c757d"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path1" />
    </marker>
  </defs>
  <!-- ===== NODES ===== -->
  <!-- p1.c  x=20 y=40 -->
  <rect
     x="20"
     y="40"
     width="90"
     height="32"
     rx="4"
     fill="#cfe2ff"
     stroke="#084298"
     stroke-width="1"
     id="rect1" />
  <text
     x="65"
     y="59"
     text-anchor="middle"
     font-size="12px"
     font-weight="bold"
     fill="#084298"
     id="text1">p1.c</text>
  <!-- p9.c  x=20 y=100 -->
  <rect
     x="20"
     y="100"
     width="90"
     height="32"
     rx="4"
     fill="#cfe2ff"
     stroke="#084298"
     stroke-width="1"
     id="rect2" />
  <text
     x="65"
     y="119"
     text-anchor="middle"
     font-size="12px"
     font-weight="bold"
     fill="#084298"
     id="text2">p9.c</text>
  <!-- lib.a  x=260 y=160 (sota p9.o) -->
  <rect
     x="260"
     y="160"
     width="90"
     height="32"
     rx="4"
     fill="#fff3cd"
     stroke="#664d03"
     stroke-width="1"
     id="rect3" />
  <text
     x="305"
     y="181"
     text-anchor="middle"
     font-size="12"
     font-weight="bold"
     fill="#664d03"
     id="text3">lib.a</text>
  <!-- gcc -S / as (per p1.c)  x=140 y=40 -->
  <rect
     x="140"
     y="40"
     width="90"
     height="32"
     rx="4"
     fill="#f8f9fa"
     stroke="#adb5bd"
     stroke-width="0.5"
     id="rect4" />
  <text
     x="185"
     y="54"
     text-anchor="middle"
     font-size="10"
     fill="#6c757d"
     id="text4">gcc -S</text>
  <text
     x="185"
     y="66"
     text-anchor="middle"
     font-size="10"
     fill="#6c757d"
     id="text5">/ as</text>
  <!-- gcc -S / as (per p9.c)  x=140 y=100 -->
  <rect
     x="140"
     y="100"
     width="90"
     height="32"
     rx="4"
     fill="#f8f9fa"
     stroke="#adb5bd"
     stroke-width="0.5"
     id="rect5" />
  <text
     x="185"
     y="114"
     text-anchor="middle"
     font-size="10"
     fill="#6c757d"
     id="text6">gcc -S</text>
  <text
     x="185"
     y="126"
     text-anchor="middle"
     font-size="10"
     fill="#6c757d"
     id="text7">/ as</text>
  <!-- p1.o  x=260 y=40 -->
  <rect
     x="260"
     y="40"
     width="90"
     height="32"
     rx="4"
     fill="#d1e7dd"
     stroke="#0a3622"
     stroke-width="1"
     id="rect7" />
  <text
     x="305"
     y="59"
     text-anchor="middle"
     font-size="12px"
     font-weight="bold"
     fill="#0a3622"
     id="text8">p1.o</text>
  <!-- p9.o  x=260 y=100 -->
  <rect
     x="260"
     y="100"
     width="90"
     height="32"
     rx="4"
     fill="#d1e7dd"
     stroke="#0a3622"
     stroke-width="1"
     id="rect9" />
  <text
     x="305"
     y="119"
     text-anchor="middle"
     font-size="12px"
     font-weight="bold"
     fill="#0a3622"
     id="text10">p9.o</text>
  <!-- ld  x=380 y=100 -->
  <rect
     x="380"
     y="100"
     width="90"
     height="32"
     rx="4"
     fill="#f8f9fa"
     stroke="#adb5bd"
     stroke-width="0.5"
     id="rect11" />
  <text
     x="425"
     y="121"
     text-anchor="middle"
     font-size="12"
     fill="#6c757d"
     id="text12">ld</text>
  <!-- executable  x=500 y=100 -->
  <rect
     x="500"
     y="100"
     width="90"
     height="32"
     rx="4"
     fill="#f8d7da"
     stroke="#842029"
     stroke-width="1"
     id="rect12" />
  <text
     x="545"
     y="114"
     text-anchor="middle"
     font-size="11"
     font-weight="bold"
     fill="#842029"
     id="text13">executable</text>
  <!-- ===== FLETXES SIMPLES (horitzontal) ===== -->
  <!-- p1.c → gcc1 -->
  <line
     x1="110"
     y1="56"
     x2="137"
     y2="56"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line13" />
  <!-- p9.c → gcc2 -->
  <line
     x1="110"
     y1="116"
     x2="137"
     y2="116"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line14" />
  <!-- gcc1 → p1.o -->
  <line
     x1="230"
     y1="56"
     x2="257"
     y2="56"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line15" />
  <!-- gcc2 → p9.o -->
  <line
     x1="230"
     y1="116"
     x2="257"
     y2="116"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line16" />
  <!-- ld → executable -->
  <line
     x1="470"
     y1="116"
     x2="497"
     y2="116"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line17" />
  <!-- ===== FLETXES DIAGONALS ===== -->
  <!-- p1.o → ld  (baixa de y=56 a y=116) -->
  <path
     d="M 350,56 C 365,56 365,116 380,116"
     fill="none"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="path17" />
  <!-- p9.o → ld  (horitzontal) -->
  <line
     x1="350"
     y1="116"
     x2="377"
     y2="116"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line18" />
  <!-- lib.a → ld  (de x=350,y=176 fins a x=380,y=116: diagonal curta cap amunt) -->
  <path
     d="M 350,176 C 365,176 365,116 377,116"
     fill="none"
     stroke="#6c757d"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="path18" />
  <!-- ===== PUNTS DE SEPARACIÓ (indica múltiples mòduls) ===== -->
  <!-- Punts suspensius entre p1 i p9 per indicar "..." -->
  <text
     x="185"
     y="91"
     text-anchor="middle"
     font-size="14px"
     fill="#6c757d"
     id="text18">⋮</text>
  <text
     x="305"
     y="91"
     text-anchor="middle"
     font-size="14px"
     fill="#6c757d"
     id="text19">⋮</text>
</svg>
