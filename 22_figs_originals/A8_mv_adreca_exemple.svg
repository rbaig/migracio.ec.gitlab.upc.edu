<svg width="100%" viewBox="0 0 680 92" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Descomposició de l'adreça lògica 0x10010004 en VPN i desplaçament</title>
<desc>L'adreça lògica A = 0x10010004, escrita en binari dins de dues caselles: a l'esquerra, els 20 bits de més pes, 0001 0000 0000 0001 0000, que són el VPN, i a la dreta, els 12 bits de menys pes, 0000 0000 0100, que són el desplaçament dins la pàgina.</desc>
<text x="186" y="55.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="end"><tspan font-style="italic">A</tspan> = 0x10010004 =</text>
<rect x="196" y="30" width="300" height="40" fill="#f8f9fa" stroke="#343a40" stroke-width="1.2"/>
<rect x="496" y="30" width="180" height="40" fill="#f8f9fa" stroke="#343a40" stroke-width="1.2"/>
<text x="346" y="55.0" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="15" fill="#343a40" text-anchor="middle">0001 0000 0000 0001 0000</text>
<text x="586" y="55.0" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="15" fill="#343a40" text-anchor="middle">0000 0000 0100</text>
<text x="346" y="22" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle" font-weight="bold">VPN</text>
<text x="586" y="22" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle" font-weight="bold">desplaçament</text>
<text x="346" y="84" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">20 bits</text>
<text x="586" y="84" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">12 bits</text>
</svg>
