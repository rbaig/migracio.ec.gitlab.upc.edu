<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Memòria cau indexada virtualment i etiquetada físicament (VIPT)</title>
<desc>Com la figura 7.11 (dreta) del tema antic. A l'esquerra, la CPU; a la dreta, l'MP, en verd. La CPU dona l'adreça lògica: el VPN va al TLB, en groc, a dalt, i alhora l'índex i el desplaçament van a l'MC, en blau, a sota. L'adreça física que dona el TLB fa d'etiqueta en un comparador dins de l'MC, i també va a l'MP, per a una fallada. De l'MC tornen a la CPU la dada i el senyal d'encert, i entre l'MC i l'MP passa el bloc. A sota, el cronograma: el TLB i l'MC alhora, i després la comparació.</desc>
