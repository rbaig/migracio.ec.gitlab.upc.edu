<svg width="100%" viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tipus de fallades segons la mida i l'associativitat de la memòria cau</title>
<desc>Gràfica qualitativa de la taxa de fallades en funció de la mida de la memòria cau, per a un programa donat, amb quatre corbes decreixents: correspondència directa (la més alta), associativa de 2 vies, de 4 vies i completament associativa (la més baixa). Les fallades d'arrencada en fred són una franja constant a baix. Entre aquesta franja i la corba completament associativa, les fallades de capacitat, que només disminueixen si augmenta la mida. Entre la completament associativa i la de correspondència directa, les de conflicte, que disminueixen en augmentar l'associativitat.</desc>
