<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 300" version="1.1">
  <title>Capes d'abstracció del computador</title>
  <desc>Tres capes niuades: Aplicacions d'usuari (llenguatge d'alt nivell), Programari de sistema (llenguatge màquina) i Maquinari. Entre l'usuari i cada capa hi ha una interfície: UI, ABI i ISA.</desc>

  <!-- Usuari -->
  <text x="340" y="25" text-anchor="middle" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" fill="#343a40">Usuari</text>

  <!-- Capa 1: Aplicacions d'usuari -->
  <rect x="40" y="50" width="600" height="240" rx="4" fill="#cfe2ff" stroke="#084298" stroke-width="1.5"/>
  <text x="340" y="90" text-anchor="middle" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" fill="#084298">Aplicacions d'usuari (llenguatge d'alt nivell)</text>

  <!-- Capa 2: Software de sistema -->
  <rect x="90" y="110" width="500" height="170" rx="4" fill="#d1e7dd" stroke="#0a3622" stroke-width="1.5"/>
  <text x="340" y="150" text-anchor="middle" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" fill="#0a3622">Programari de sistema (llenguatge màquina)</text>

  <!-- Capa 3: Maquinari -->
  <rect x="140" y="170" width="400" height="100" rx="4" fill="#fff3cd" stroke="#664d03" stroke-width="1.5"/>
  <text x="340" y="230" text-anchor="middle" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" fill="#664d03">Maquinari</text>

  <!-- Interfícies -->
  <rect x="305" y="40" width="70" height="20" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
  <text x="340" y="55" text-anchor="middle" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#343a40">UI</text>

  <rect x="305" y="100" width="70" height="20" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
  <text x="340" y="115" text-anchor="middle" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#343a40">ABI</text>

  <rect x="305" y="160" width="70" height="20" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
  <text x="340" y="175" text-anchor="middle" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#343a40">ISA</text>
</svg>
