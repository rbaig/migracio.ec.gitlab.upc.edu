<svg width="590" height="320" viewBox="0 0 590 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Semisumador i sumador complet (mode clar)</title>
<desc>(a) Semisumador: una porta XOR dona el bit de suma s = a xor b i una porta AND dona el bit de ròssec c = a and b. (b) Sumador complet fet amb dos semisumadors i una porta OR: el primer suma a_i i b_i; el segon suma el resultat, a_i xor b_i, amb el ròssec d'entrada c_i i dona s_i; la OR combina a_i and b_i i (a_i xor b_i) and c_i en el ròssec de sortida c_(i+1).</desc>
<text x="10" y="22" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="start" font-weight="bold"><tspan>(a) semisumador</tspan></text>
