<svg width="100%" viewBox="0 0 680 266" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Compartició de pàgines</title>
<desc>A l'esquerra, dues taules de pàgines, de P1 a dalt, en blau, i de P2 a sota, en verd, amb columnes V, D, E i PPN. A la dreta, la memòria física, amb quatre marcs, de PPN 0x00 a 0x03. A P1, VPN 0x00000 apunta a PPN 0x02 i VPN 0x00001 a PPN 0x00; a P2, VPN 0x00000 apunta a PPN 0x03 i VPN 0x00001 a PPN 0x02. Les dues entrades que apunten a PPN 0x02 tenen V = 1 i E = 1, i les seves fletxes, més gruixudes, convergeixen al marc 0x02, mig blau i mig verd, rotulat «compartida». PPN 0x01 és lliure.</desc>
