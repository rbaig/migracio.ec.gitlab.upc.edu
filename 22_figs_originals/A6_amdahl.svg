<title>Llei d'Amdahl</title>
<desc>Dues barres de temps d'execució, l'original i la millorada. L'original, d'alçada t0, té una part blanca, la fracció Px que es millora, i una de grisa, 1 − Px, que no es millora. La millorada, d'alçada t1, conserva la part grisa i redueix la blanca en el factor Sx, que indica una fletxa. A la dreta, les fórmules: t millorat = t0 · Px / Sx i t no millorat = t0 · (1 − Px).</desc>
