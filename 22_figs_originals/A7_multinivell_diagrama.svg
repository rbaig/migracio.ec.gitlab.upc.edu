<svg width="100%" viewBox="0 0 660 296" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Memòries cau multinivell</title>
<desc>Tres configuracions: (a) la CPU connectada a l’MP, amb un temps d'accés llarg; (b) una MC entre la CPU i l’MP, amb temps d'encert t sub h i penalització t sub p a les fallades; (c) L1 i L2 entre la CPU i l’MP: les fallades de L1 que encerten a L2 paguen t sub h sub L2, i només les que també fallen a L2 paguen t sub p.</desc>
<text x="14" y="30" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#343a40" text-anchor="start" font-weight="bold">(a)</text>
<text x="44" y="30" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="start">Problema: el temps d'accés a l’MP limita el rendiment</text>
<rect x="44" y="48" width="70" height="30" rx="4" fill="#fff3cd" stroke="#664d03" stroke-width="1"/><text x="79.0" y="67.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#664d03" text-anchor="middle" font-weight="bold">CPU</text>
<rect x="560" y="48" width="70" height="30" rx="4" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="595.0" y="67.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#0a3622" text-anchor="middle" font-weight="bold">MP</text>
<line x1="118" y1="63" x2="556" y2="63" stroke="#343a40" stroke-width="1.2"/>
<polygon points="556,63 548.6,66.1 548.6,59.9" fill="#343a40"/>
<polygon points="118,63 125.4,59.9 125.4,66.1" fill="#343a40"/>
<text x="337.0" y="56" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="8" font-style="italic">MP</tspan><tspan dy="-3"> </tspan></text>
<text x="14" y="122" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#343a40" text-anchor="start" font-weight="bold">(b)</text>
<text x="44" y="122" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="start">Solució: una MC explota la localitat; el temps llarg només es paga a les fallades</text>
<rect x="44" y="140" width="70" height="30" rx="4" fill="#fff3cd" stroke="#664d03" stroke-width="1"/><text x="79.0" y="159.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#664d03" text-anchor="middle" font-weight="bold">CPU</text>
<rect x="230" y="140" width="70" height="30" rx="4" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="265.0" y="159.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle" font-weight="bold">MC</text>
<line x1="118" y1="155" x2="226" y2="155" stroke="#343a40" stroke-width="1.2"/>
<polygon points="226,155 218.6,158.1 218.6,151.9" fill="#343a40"/>
<polygon points="118,155 125.4,151.9 125.4,158.1" fill="#343a40"/>
<text x="172.0" y="148" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="8" font-style="italic">h</tspan><tspan dy="-3"> </tspan></text>
<rect x="560" y="140" width="70" height="30" rx="4" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="595.0" y="159.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#0a3622" text-anchor="middle" font-weight="bold">MP</text>
<line x1="304" y1="155" x2="556" y2="155" stroke="#343a40" stroke-width="1.2"/>
<polygon points="556,155 548.6,158.1 548.6,151.9" fill="#343a40"/>
<polygon points="304,155 311.4,151.9 311.4,158.1" fill="#343a40"/>
<text x="430.0" y="148" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="8" font-style="italic">p</tspan><tspan dy="-3"> </tspan></text>
<text x="14" y="214" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#343a40" text-anchor="start" font-weight="bold">(c)</text>
<text x="44" y="214" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="start">Les fallades de L1 que encerten a L2 paguen el temps d’encert de L2, no el de l’MP</text>
<rect x="44" y="232" width="70" height="30" rx="4" fill="#fff3cd" stroke="#664d03" stroke-width="1"/><text x="79.0" y="251.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#664d03" text-anchor="middle" font-weight="bold">CPU</text>
<rect x="200" y="232" width="70" height="30" rx="4" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="235.0" y="251.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle" font-weight="bold">L1</text>
<line x1="118" y1="247" x2="196" y2="247" stroke="#343a40" stroke-width="1.2"/>
<polygon points="196,247 188.6,250.1 188.6,243.9" fill="#343a40"/>
<polygon points="118,247 125.4,243.9 125.4,250.1" fill="#343a40"/>
<text x="157.0" y="240" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="8" font-style="italic">h</tspan><tspan dy="2" font-size="7" font-style="italic">L1</tspan><tspan dy="-5"> </tspan></text>
<rect x="360" y="232" width="70" height="30" rx="4" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="395.0" y="251.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#084298" text-anchor="middle" font-weight="bold">L2</text>
<line x1="274" y1="247" x2="356" y2="247" stroke="#343a40" stroke-width="1.2"/>
<polygon points="356,247 348.6,250.1 348.6,243.9" fill="#343a40"/>
<polygon points="274,247 281.4,243.9 281.4,250.1" fill="#343a40"/>
<text x="315.0" y="240" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="8" font-style="italic">h</tspan><tspan dy="2" font-size="7" font-style="italic">L2</tspan><tspan dy="-5"> </tspan></text>
<rect x="560" y="232" width="70" height="30" rx="4" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="595.0" y="251.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" fill="#0a3622" text-anchor="middle" font-weight="bold">MP</text>
<line x1="434" y1="247" x2="556" y2="247" stroke="#343a40" stroke-width="1.2"/>
<polygon points="556,247 548.6,250.1 548.6,243.9" fill="#343a40"/>
<polygon points="434,247 441.4,243.9 441.4,250.1" fill="#343a40"/>
<text x="495.0" y="240" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="8" font-style="italic">p</tspan><tspan dy="-3"> </tspan></text>
<rect x="34" y="222" width="246" height="50" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="5,3"/>
<text x="157" y="284" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle" font-style="italic">per a L2, la «CPU» és el conjunt CPU + L1</text>
</svg>
