<svg width="100%" viewBox="0 0 680 750" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Memòria cau indexada físicament (PIPT)</title>
<desc>Com la figura 7.10 del tema antic. A dalt, l'adreça lògica, partida en VPN i desplaçament de pàgina. El TLB, en groc, té quatre entrades amb les columnes VPN, V, D, E i PPN; el VPN de l'adreça arriba a un comparador per entrada, que el confronta amb el VPN guardat, i una porta OR de les quatre sortides dona l'encert de TLB. La tercera entrada encerta, ressaltada, i el seu PPN baixa a l'adreça física, on s'ajunta amb el desplaçament de pàgina, que no es tradueix. L'adreça física es parteix en etiqueta, índex i desplaçament de bloc. L'índex selecciona una línia de la memòria cau, en blau, amb les columnes V, etiqueta i dades; l'etiqueta guardada es compara amb la de l'adreça, i una porta AND amb el bit V dona l'encert a l'MC. Un multiplexor, governat pel desplaçament de bloc, tria la dada del bloc. A sota, el cronograma: l'accés al TLB i el de l'MC, un darrere l'altre, en sèrie.</desc>
