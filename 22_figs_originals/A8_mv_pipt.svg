<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Memòria cau indexada físicament (PIPT)</title>
<desc>Diagrama de blocs en una fila: la CPU envia l'adreça lògica al TLB, en groc; amb un encert de TLB, l'adreça física passa a l’MC, en blau, i amb un encert d’MC en surt la dada. Si l’MC falla, accedeix a l’MP, en verd, a sota. A sota, el cronograma: l'accés al TLB i el de l’MC, un darrere l'altre, en sèrie.</desc>
<rect x="20" y="46" width="80" height="48" rx="4" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/><text x="60.0" y="74.33333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#6c757d" text-anchor="middle" font-weight="bold">CPU</text>
<rect x="200" y="46" width="90" height="48" rx="4" fill="#fff3cd" stroke="#664d03" stroke-width="1"/><text x="245.0" y="74.33333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#664d03" text-anchor="middle" font-weight="bold">TLB</text>
<rect x="390" y="46" width="90" height="48" rx="4" fill="#cfe2ff" stroke="#084298" stroke-width="1"/><text x="435.0" y="74.33333333333333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#084298" text-anchor="middle" font-weight="bold">MC</text>
<rect x="390" y="150" width="90" height="48" rx="4" fill="#d1e7dd" stroke="#0a3622" stroke-width="1"/><text x="435.0" y="178.33333333333334" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#0a3622" text-anchor="middle" font-weight="bold">MP</text>
<line x1="100" y1="70" x2="198" y2="70" stroke="#343a40" stroke-width="1.2"/>
<polygon points="198,70 190.6,73.1 190.6,66.9" fill="#343a40"/>
<text x="149" y="62" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">adreça lògica</text>
<line x1="290" y1="70" x2="388" y2="70" stroke="#343a40" stroke-width="1.2"/>
<polygon points="388,70 380.6,73.1 380.6,66.9" fill="#343a40"/>
<text x="339" y="62" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">adreça física</text>
<text x="339" y="86" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle" font-style="italic">(encert de TLB)</text>
<line x1="480" y1="70" x2="578" y2="70" stroke="#343a40" stroke-width="1.2"/>
<polygon points="578,70 570.6,73.1 570.6,66.9" fill="#343a40"/>
<text x="529" y="62" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">encert</text>
<text x="584" y="74" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="start" font-weight="bold">dada</text>
<line x1="435" y1="96" x2="435" y2="148" stroke="#343a40" stroke-width="1.2"/>
<polygon points="435,148 431.9,140.6 438.1,140.6" fill="#343a40"/>
<polygon points="435,96 438.1,103.4 431.9,103.4" fill="#343a40"/>
<text x="443" y="126" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="start">fallada</text>
<text x="20" y="244" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11" fill="#343a40" text-anchor="start" font-weight="bold">Temps d'accés</text>
<rect x="160" y="236" width="90" height="18" fill="#fff3cd"/>
<rect x="160.5" y="236.5" width="89" height="17" fill="none" stroke="#664d03" stroke-width="1"/><text x="205.0" y="248.83333333333334" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#664d03" text-anchor="middle">TLB</text>
<rect x="250" y="236" width="90" height="18" fill="#cfe2ff"/>
<rect x="250.5" y="236.5" width="89" height="17" fill="none" stroke="#084298" stroke-width="1"/><text x="295.0" y="248.83333333333334" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#084298" text-anchor="middle">MC</text>
<text x="350" y="249" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="start" font-style="italic">en sèrie</text>
<line x1="160" y1="274" x2="560" y2="274" stroke="#6c757d" stroke-width="1"/>
<polygon points="560,274 552.6,277.1 552.6,270.9" fill="#6c757d"/>
<text x="560" y="288" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="end" font-style="italic">temps</text>
</svg>
