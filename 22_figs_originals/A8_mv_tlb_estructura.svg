<svg width="100%" viewBox="0 0 680 258" xmlns="http://www.w3.org/2000/svg" role="img">
<title>La taula de pàgines i el TLB</title>
<desc>A l'esquerra, la taula de pàgines, a la memòria principal, amb columnes V, D, E i PPN i el VPN a fora com a índex, de 0x00000 a 0x00005 i 0xFFFFF; les entrades vàlides, en blau. A la dreta, el TLB, a la MMU, amb quatre entrades i columnes V, VPN, D, E i PPN: tres entrades vàlides, en groc, amb els VPN 0x00003, 0x00000 i 0x00002, i una quarta entrada lliure, amb V = 0, en gris. Tres fletxes discontínues porten cada PTE vàlida de la taula a l'entrada del TLB que n'és còpia. Són les dades inicials de l'exemple de traducció amb TLB.</desc>
