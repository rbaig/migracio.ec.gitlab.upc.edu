<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Taula de pàgines de dos nivells (Sv32)</title>
<desc>A dalt, l'adreça lògica de 32 bits dividida en VPN[1], de 10 bits, VPN[0], de 10 bits, i el desplaçament, de 12 bits. VPN[1] indexa la taula de primer nivell, o directori de pàgines, de 1024 entrades, a la qual apunta el registre de taula de pàgines. Les entrades 0 i 1023 del directori són vàlides, V = 1, i apunten cadascuna a una taula de segon nivell, de 1024 PTE, que indexa VPN[0]. L'entrada 1 té V = 0 i no té taula de segon nivell.</desc>
<rect x="200" y="28" width="100" height="26" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/><text x="250.0" y="45.166666666666664" font-family="'Liberation Mono', 'Courier New', Courier, monospace" font-size="11" fill="#343a40" text-anchor="middle">VPN[1]</text>
<text x="250.0" y="20" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">10 bits</text>
