<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>La taula de pàgines</title>
<desc>Una taula de columnes V, D, E i PPN, indexada pel VPN, que s'escriu a fora, a l'esquerra, de 0x00000 a 0x00005, punts suspensius i 0xFFFFF, amb una cota de 2 elevat a 20 entrades. Les entrades 0x00000, 0x00002 i 0x00003 tenen V = 1 i un PPN, 0x01, 0x02 i 0x00, i són en blau; les altres tenen V = 0, sense PPN, en gris. El registre de taula de pàgines, a dalt a l'esquerra, apunta amb una fletxa a l'inici de la taula: l'adreça base.</desc>
