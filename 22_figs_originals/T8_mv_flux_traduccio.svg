<text x="560" y="294" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">(a una entrada lliure o,</text>
<text x="560" y="306" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">si no n’hi ha, a la LRU)</text>
