<svg width="100%" viewBox="0 0 960 650" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flux complet de traducció d'una adreça</title>
<desc>Diagrama de flux en tres columnes. Al centre, en verd, el camí de l'encert: es cerca el VPN al TLB; si hi és i V = 1, es comprova si és una escriptura amb E = 0, que fa que el SO avorti el procés, i si és una escriptura amb D = 0, que posa D = 1 al TLB i a la PTE; s'acaba accedint a la dada amb l'adreça física. A l'esquerra, en groc, la fallada de TLB: es llegeix la PTE, es copia al TLB i es reintenta l'accés. A la dreta, en vermell, la fallada de pàgina, quan V = 0: si l'adreça no és vàlida, el SO avorta el procés; si ho és i no hi ha cap marc lliure, es tria una víctima, que s'escriu al disc si D = 1; després es carrega la pàgina, s'actualitza la PTE i es reexecuta la instrucció. El reintent i la reexecució tornen a la cerca al TLB.</desc>
