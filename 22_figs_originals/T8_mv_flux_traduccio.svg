<text x="560" y="142" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">(recorregut per maquinari,</text>
<text x="560" y="154" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">sense interrompre el programa)</text>
