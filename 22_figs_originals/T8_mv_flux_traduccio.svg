<svg width="100%" viewBox="0 0 960 740" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flux complet de traducció d'una adreça</title>
<desc>Diagrama de flux en tres columnes, agrupades en dues zones ombrejades: la blava, el que fa el maquinari (la MMU), i la rosa, el que resol el sistema operatiu. El flux entra a dalt, amb el VPN, i surt a baix, amb el PPN, per finalitzar l'accés a memòria. A l'esquerra, en verd, el camí de l'encert: es cerca el VPN al TLB; si hi és, es comprova si és una escriptura amb E = 0, que provoca una excepció de protecció i el SO avorta el procés, i si és una escriptura amb D = 0, que posa D = 1 al TLB i a la PTE. Al centre, en groc, la fallada de TLB, que resol la MMU: llegeix la PTE de la taula de pàgines i, si V = 1, la copia al TLB i la traducció continua com en un encert. Si V = 0, es produeix una excepció, la fallada de pàgina, que resol el SO, a la dreta: si l'adreça no és vàlida, avorta el procés (segmentation fault); si ho és i no hi ha cap marc lliure, tria el marc (PPN) a reemplaçar i posa V = 0 a la seva PTE i també al TLB, i l'escriu al disc si D = 1; després carrega la pàgina i actualitza la PTE amb V = 1, D = 0 i el PPN. Una fletxa que surt cap amunt indica que es reexecuta la instrucció.</desc>
