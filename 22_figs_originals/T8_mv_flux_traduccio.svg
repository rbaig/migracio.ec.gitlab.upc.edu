<text x="790" y="591" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">del disc al marc</text>
<rect x="705.0" y="628.0" width="170" height="44" rx="6" fill="#f8d0d3" stroke="#dc3545" stroke-width="1.2"/>
<text x="790" y="645" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">Actualitza la PTE</text>
<text x="790" y="661" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">(V = 1, D = 0 i PPN)</text>
<rect x="705.0" y="698.0" width="170" height="44" rx="6" fill="#f8d0d3" stroke="#dc3545" stroke-width="1.2"/>
<text x="790" y="715" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">Reexecuta</text>
<text x="790" y="731" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">la instrucció</text>
<text x="560" y="86" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#664d03" text-anchor="middle" font-weight="bold">Fallada de TLB (la resol la MMU)</text>
<text x="790" y="166" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#dc3545" text-anchor="middle" font-weight="bold">Fallada de pàgina (la resol el SO)</text>
<text x="300" y="20" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#198754" text-anchor="middle" font-weight="bold">Encert de TLB</text>
