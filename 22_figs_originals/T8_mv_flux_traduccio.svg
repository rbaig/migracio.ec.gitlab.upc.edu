<text x="560" y="213" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">V = 1?</text>
<rect x="445.0" y="257.0" width="230" height="66" rx="6" fill="#fff3cd" stroke="#664d03" stroke-width="1.2"/>
