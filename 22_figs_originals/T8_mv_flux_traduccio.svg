<svg width="100%" viewBox="0 0 960 770" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flux complet de traducció d'una adreça</title>
<desc>Diagrama de flux en tres columnes. A l'esquerra, en verd, el camí de l'encert: es cerca el VPN al TLB; si hi és, es comprova si és una escriptura amb E = 0, que provoca una excepció de protecció i el SO avorta el procés, i si és una escriptura amb D = 0, que posa D = 1 al TLB i a la PTE; s'acaba accedint a la dada amb l'adreça física. Al centre, en groc, la fallada de TLB, que resol la MMU: llegeix la PTE de la taula de pàgines i, si V = 1, la copia al TLB i torna a la cerca, que ara encerta. A la dreta, en vermell, la fallada de pàgina, quan la PTE té V = 0, que resol el SO: si l'adreça no és vàlida, avorta el procés; si ho és i no hi ha cap marc lliure, tria una víctima, posa V = 0 a la seva PTE i n'invalida l'entrada del TLB, i l'escriu al disc si D = 1; després carrega la pàgina, actualitza la PTE amb V = 1, D = 0 i el PPN, i reexecuta la instrucció, que torna a la cerca al TLB.</desc>
