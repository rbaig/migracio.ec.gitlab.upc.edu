"comanda" = { si = "ordre", obs = "En informàtica, *command* és «ordre» («línia d'ordres», Termcat); al DIEC, «comanda» és un encàrrec comercial ([D-106]({{< var decisions >}}#d-106))." }
"solapar, solapament" = { si = "superposar, superposició; fer alhora", obs = "No és al DIEC. A l'espai, «superposar-se» («els camps no se superposen»); en el temps, «fer-se alhora» o «coincidir» ([D-106]({{< var decisions >}}#d-106))." }
"indentar, indentació" = { si = "sagnar, sagnat", obs = "*Indentation* és «sagnat» (Termcat; el DIEC defineix «sagnia» remetent a «sagnat»). «Indentar» i «indentació» només són al Termcat en ciències de la salut ([D-106]({{< var decisions >}}#d-106))." }
"encuar" = { si = "posar a la cua", obs = "No és al DIEC; «posar a la cua» és el terme del Termcat ([D-106]({{< var decisions >}}#d-106))." }
"descomposa / descomposem / descomposen / descomposat" = { si = "descompondre (descompon, descomponem…)", obs = "«Descomposar» no és al DIEC. La taula en dona les formes conjugades i no l'infinitiu, perquè la comprovació (§Comprovacions per nivells) també trobaria «descomposició», que és correcte ([D-106]({{< var decisions >}}#d-106))." }
"rota / roten / rotat" = { si = "girar, fer una rotació", obs = "Al DIEC, «rotar» és fer rots. «Rotació» és correcte, i per això hi van les formes conjugades, com a «descomposar» ([D-106]({{< var decisions >}}#d-106))." }

