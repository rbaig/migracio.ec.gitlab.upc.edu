# Lèxic anglès–català del llibre: la font de veritat (D-115, que inverteix D-100).
#
# Cada terme anglès té aquí la forma catalana que fa servir el llibre, i el text
# s'hi comprova: 25_scripts/gen_glossari.py --comprova (make comprova) atura el
# commit si una presentació «**terme català** (*english*)» del text no coincideix
# amb aquest fitxer, si presenta un terme que no hi és o si un terme d'aquí no té
# cap presentació. El mateix script en genera el glossari de 12_sigles_simbols.qmd
# §Termes, amb el tema de la primera presentació, i la taula de formes que no
# s'han de fer servir de 13_contrib.qmd (auto_termes/, no versionat).
#
# Un terme nou s'afegeix aquí i es presenta al text, a la primera aparició del
# llibre, en el mateix commit (13_contrib.qmd §Anglicismes i terminologia
# obligatòria). La tria de la forma segueix D-116.
#
#   [termes]     clau: el terme anglès, en singular (D-108) i en minúscula, tret
#                d'una sigla o d'un nom propi (la taula hi posa la majúscula
#                inicial). Camps:
#                  ca           la forma catalana, en singular i en minúscula;
#                  fonts        les fonts que en donen la forma per al concepte del
#                               llibre, per ordre de precedència: DIEC, Termcat,
#                               Optimot, Softcatalà, Viquipèdia (13_contrib.qmd
#                               §Referència normativa); o, sols, «sintagma» (cap
#                               font, i un sintagma transparent) o «llibre» (una
#                               decisió del llibre, explicada a `obs`). La columna
#                               «Fonts» del glossari en fa els enllaços (D-116);
#                  viquipedia   el títol de l'article, si no és la forma (opcional);
#                  obs          les observacions d'ús (la quarta columna);
#                  nombre       `plural`, si el terme es manté en plural perquè
#                               gairebé no es fa servir en singular; `no_plural`,
#                               si acaba en -s i és singular;
#                  presentacio  formes de la presentació al text que no són `ca`
#                               ni el seu plural regular (opcional);
#                  mots         flexions que el corrector ortogràfic ha d'acceptar
#                               i no coneix (opcional): el diccionari de termes,
#                               24_specs/diccionari_termes.txt, té els mots de la
#                               clau, de `ca`, de `presentacio` i de `mots`.
#                Una presentació en plural (en anglès, amb -s o -es; en català,
#                el plural regular de `ca`) és la del mateix terme.
#   [en_angles]  els termes que el llibre manté en anglès, perquè el terme català
#                no existeix o és molt poc usat (D-116): `ca`, la forma catalana,
#                si n'hi ha, i `motiu`. Diversos termes en una clau, separats per
#                comes, fan una sola fila.
#   [no_admeses] les formes que no s'han de fer servir: no són termes anglesos,
#                sinó formes que no són normatives o que no són el terme
#                informàtic en català. Clau: la forma, o diverses, separades per
#                comes o per barres; `si`, el que s'escriu; `obs`, opcional. En
#                l'ordre de la taula de 13_contrib.qmd §Formes que no s'han de fer
#                servir, que se'n genera. 25_scripts/lint_prosa.py atura el commit
#                amb cadascuna, també en plural, en femení o conjugada: una forma
#                nova hi entra en el mateix commit que la treu del corpus (D-105).
#   [angles_en_pla]  els textos on un terme anglès de [termes] o de [en_angles] va
#                en pla sense ser-ne un ús (noms propis: «RISC-V GNU Compiler
#                Toolchain»). Clau: el text literal; `perque`. 25_scripts/lint_prosa.py
#                atura el commit amb un terme de [termes] en pla, que s'escriu en
#                català, i amb un de [en_angles] sense cursiva (D-116), fora d'aquests
#                textos, també a les cel·les de les taules.
#   [no_presentacions]  els mots anglesos que el text glossa amb la forma d'una
#                presentació, «**català** (*english*)», però que no són termes del
#                llibre: noms de la interfície de RARS, de camps i de bits, o de les
#                fases del treball amb la Pico 2. Clau: el mot anglès; `perque`. La
#                comprovació no els busca a [termes] ni el glossari no els recull.
#   [sigles]     les sigles del llibre (13_contrib.qmd §Sigles, símbols i notació),
#                de les quals es genera la taula de 12_sigles_simbols.qmd §Sigles, per
#                ordre alfabètic (D-118). Clau: la sigla, tal com s'escriu (LSB i LSb
#                són dues sigles). Camps, que donen el format únic de l'expansió al
#                text, «ca (*en*, SIGLA)», «*en* (SIGLA)» o «ca (SIGLA)»:
#                  ca        la forma catalana (opcional, si n'hi ha);
#                  en        l'expansió anglesa (opcional): quan la sigla ve de
#                            l'anglès, o quan el parèntesi presenta també el terme
#                            anglès (BA, *stack frame*, que és a [termes] amb el
#                            mateix `ca`); en minúscula, tret dels noms propis;
#                  obs       les observacions (opcional);
#                  excepcio  el motiu pel qual la comprovació no en mira les
#                            aparicions (opcional): una sigla homònima d'una altra
#                            cosa del text, o que només surt en codi.
#                La cel·la «Significat» de la taula és «ca (*en*)», «*en*» o «ca».
#                El detector de presentacions de termes no compta com a terme
#                l'expansió anglesa d'una sigla, tret que sigui a [termes].
#                25_scripts/sigles.py --comprova (make comprova) hi comprova el text.
#   [no_sigles]  els mots en majúscules del text que no són sigles del llibre i que
#                la comprovació de les sigles no ha de demanar a [sigles]: noms
#                propis, noms de camps i de registres, notacions que defineix un
#                enunciat… Clau: el mot, o un text literal si no és un sol mot
#                («ISO/IEC 9899:2024»); `perque` (D-118).

