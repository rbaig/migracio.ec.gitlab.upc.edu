# Lèxic anglès–català del llibre: la font de veritat (D-115, que inverteix D-100).
#
# Cada terme anglès té aquí la forma catalana que fa servir el llibre, i el text
# s'hi comprova: 25_scripts/gen_glossari.py --comprova (make comprova) atura el
# commit si una presentació «**terme català** (*english*)» del text no coincideix
# amb aquest fitxer, si presenta un terme que no hi és o si un terme d'aquí no té
# cap presentació. El mateix script en genera el glossari de 12_sigles_simbols.qmd
# §Termes, amb el tema de la primera presentació, i la taula de formes que no
# s'han de fer servir de 13_contrib.qmd (auto_termes/, no versionat).
#
# Un terme nou s'afegeix aquí i es presenta al text, a la primera aparició del
# llibre, en el mateix commit (13_contrib.qmd §Anglicismes i terminologia
# obligatòria). La tria de la forma segueix D-88.
#
#   [termes]     clau: el terme anglès, en singular (D-108) i en minúscula, tret
#                d'una sigla o d'un nom propi (la taula hi posa la majúscula
#                inicial). Camps:
#                  ca           la forma catalana, en singular i en minúscula;
#                  obs          les observacions d'ús (la quarta columna);
#                  nombre       `plural`, si el terme es manté en plural perquè
#                               gairebé no es fa servir en singular; `no_plural`,
#                               si acaba en -s i és singular;
#                  presentacio  formes de la presentació al text que no són `ca`
#                               ni el seu plural regular (opcional);
#                  mots         flexions que el corrector ortogràfic ha d'acceptar
#                               i no coneix (opcional): el diccionari de termes,
#                               24_specs/diccionari_termes.txt, té els mots de la
#                               clau, de `ca`, de `presentacio` i de `mots`.
#                Una presentació en plural (en anglès, amb -s o -es; en català,
#                el plural regular de `ca`) és la del mateix terme.
#   [en_angles]  els termes que el llibre manté en anglès, perquè el terme català
#                no existeix o és molt poc usat (D-88): `ca`, la forma catalana,
#                si n'hi ha, i `motiu`. Diversos termes en una clau, separats per
#                comes, fan una sola fila.
#   [no_admeses] les formes que no s'han de fer servir: no són termes anglesos,
#                sinó formes que no són normatives o que no són el terme
#                informàtic en català. Clau: la forma, o diverses, separades per
#                comes o per barres; `si`, el que s'escriu; `obs`, opcional. En
#                l'ordre de la taula de 13_contrib.qmd §Formes que no s'han de fer
#                servir, que se'n genera. 25_scripts/lint_prosa.py atura el commit
#                amb cadascuna, també en plural, en femení o conjugada: una forma
#                nova hi entra en el mateix commit que la treu del corpus (D-105).

[termes]
