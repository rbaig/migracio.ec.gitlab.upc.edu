"miss" = { ca = "fallada", nombre = "no_plural" }
"multicore" = { ca = "multinucli", obs = "Adjectiu invariable: «processador multinucli», «disseny multinucli». Termcat." }
"nesting" = { ca = "imbricació", mots = ["imbricacions"] }
"no-write allocate" = { ca = "escriptura sense assignació" }
"non-leaf" = { ca = "no fulla" }
"null pointer" = { ca = "punter nul" }
