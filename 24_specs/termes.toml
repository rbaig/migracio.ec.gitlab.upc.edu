[en_angles]
"pipeline" = { ca = "«canal» (Termcat)", motiu = "El terme català és molt poc usat en arquitectura de computadors, i es confon amb un canal de comunicació; el Termcat admet *pipeline* com a sinònim complementari. Només surt en un aprofundiment d'A9." }
"heap" = { ca = "«monticle» (Optimot)", motiu = "El terme català és molt poc usat, i a l'Optimot és de l'estructura de dades." }
"target" = { ca = "—", motiu = "No és a l'Optimot. A1 el glossa com «la màquina destí»." }
"caller, callee" = { ca = "«la funció que crida», «la funció cridada»", motiu = "Al text, la perífrasi catalana (taula de dalt); a les figures i a les columnes de les taules de registres, l'anglès, per l'espai." }
"caller-saved, callee-saved" = { ca = "—", motiu = "Termes de l'ABI." }
"sticky" = { ca = "—", motiu = "El bit S del sumador (G, R i S) i els indicadors de `fflags`: el Softcatalà només en dona el sentit general («enganxós»), i l'Optimot no en té cap terme." }
