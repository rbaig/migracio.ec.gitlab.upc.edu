"load" = { ca = "lectura", obs = "Les instruccions que llegeixen la memòria (`lw`, `flw`…) i la seva operació, també el verb (*llegir*). No ho és la càrrega d'immediats o d'adreces (`li`, `lui`, `la`), la del programa, la d'una pàgina ni la d'un bloc a l'MC." }
"load/store" = { ca = "lectura/escriptura", presentacio = ["model lectura/escriptura"] }   # decisió de l'usuari (60f61d0)
"loader" = { ca = "carregador" }
"local variable" = { ca = "variable local" }
"major page fault" = { ca = "fallada major" }
"memory addressing mode" = { ca = "mode memòria" }
