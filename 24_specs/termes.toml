[en_angles]
"pipeline" = { ca = "«canal» (Termcat)", motiu = "El terme català és molt poc usat en arquitectura de computadors, i es confon amb un canal de comunicació; el Termcat admet *pipeline* com a sinònim complementari. Només surt en un aprofundiment d'A9." }
"heap" = { ca = "«monticle» (Optimot)", motiu = "El terme català és molt poc usat, i a l'Optimot és de l'estructura de dades." }
"target" = { ca = "—", motiu = "No és a l'Optimot. A1 el glossa com «la màquina destí»." }
"caller, callee" = { ca = "«la funció que crida», «la funció cridada»", motiu = "Al text, la perífrasi catalana (taula de dalt); a les figures i a les columnes de les taules de registres, l'anglès, per l'espai." }
"caller-saved, callee-saved" = { ca = "—", motiu = "Termes de l'ABI." }
"sticky" = { ca = "—", motiu = "El bit S del sumador (G, R i S) i els indicadors de `fflags`: el Softcatalà només en dona el sentit general («enganxós»), i l'Optimot no en té cap terme." }

[no_admeses]
"fallo" = { si = "fallada" }
"anidat / anidament, aniuat / aniuament" = { si = "imbricat / imbricació", obs = "Bucles imbricats, crides imbricades. «Aniuat» no és el terme informàtic en català ([D-34]({{< var decisions >}}#d-34))." }
"empotrat" = { si = "encastat", obs = "Sistemes encastats (*embedded systems*)." }
"promig" = { si = "mitjana" }
"tamany" = { si = "mida", obs = "No normatiu. Per a la distinció `mida` vs. `longitud`, vegeu més avall." }
"lliurable" = { si = "lliurament" }
"mapeig, mapejar" = { si = "mapatge, mapar" }
"ample de banda" = { si = "amplada de banda", obs = "Forma normalitzada (Termcat)." }
"punt flotant" = { si = "coma flotant", obs = "Calc de *floating point* ([D-37]({{< var decisions >}}#d-37))." }
"comanda" = { si = "ordre", obs = "En informàtica, *command* és «ordre» («línia d'ordres», Termcat); al DIEC, «comanda» és un encàrrec comercial ([D-106]({{< var decisions >}}#d-106))." }
"solapar, solapament" = { si = "superposar, superposició; fer alhora", obs = "No és al DIEC. A l'espai, «superposar-se» («els camps no se superposen»); en el temps, «fer-se alhora» o «coincidir» ([D-106]({{< var decisions >}}#d-106))." }
"indentar, indentació" = { si = "sagnar, sagnat", obs = "*Indentation* és «sagnat» (Termcat; el DIEC defineix «sagnia» remetent a «sagnat»). «Indentar» i «indentació» només són al Termcat en ciències de la salut ([D-106]({{< var decisions >}}#d-106))." }
"encuar" = { si = "posar a la cua", obs = "No és al DIEC; «posar a la cua» és el terme del Termcat ([D-106]({{< var decisions >}}#d-106))." }
"descomposa / descomposem / descomposen / descomposat" = { si = "descompondre (descompon, descomponem…)", obs = "«Descomposar» no és al DIEC. La taula en dona les formes conjugades i no l'infinitiu, perquè la comprovació (§Comprovacions per nivells) també trobaria «descomposició», que és correcte ([D-106]({{< var decisions >}}#d-106))." }
"rota / roten / rotat" = { si = "girar, fer una rotació", obs = "Al DIEC, «rotar» és fer rots. «Rotació» és correcte, i per això hi van les formes conjugades, com a «descomposar» ([D-106]({{< var decisions >}}#d-106))." }
