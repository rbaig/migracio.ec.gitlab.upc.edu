[en_angles]
"pipeline" = { ca = "«canal» (Termcat)", motiu = "El terme català és molt poc usat en arquitectura de computadors, i es confon amb un canal de comunicació; el Termcat admet *pipeline* com a sinònim complementari. Només surt en un aprofundiment d'A9." }
"heap" = { ca = "«memòria en monticle» (Termcat)", motiu = "El terme català és molt poc usat; «monticle», sol, és l'estructura de dades." }
"target" = { ca = "—", motiu = "No és a l'Optimot amb aquest sentit. A1 el glossa com «la màquina destí»." }
"caller, callee, saver" = { ca = "«la funció o subrutina que crida», «la funció o subrutina cridada»; *Saver*, —", motiu = "Al text, la perífrasi catalana; a les figures i a les taules de registres, l'anglès, per l'espai: la columna *Saver* hi diu qui desa el registre, *Caller* o *Callee*." }
"caller-saved, callee-saved" = { ca = "—", motiu = "Termes de l'ABI." }
"little-endian, big-endian" = { ca = "«ordre dels bytes petit-gran», «gran-petit» (Termcat)", motiu = "Els termes catalans són molt poc usats; el concepte, l'ordre dels bytes (*endianness*), és en català." }
"sticky" = { ca = "—", motiu = "El bit S del sumador (G, R i S) i els indicadors de `fflags`: el Softcatalà només en dona el sentit general («enganxós»), i l'Optimot no en té cap terme." }
"stride" = { ca = "—", motiu = "La distància entre dos accessos consecutius a la memòria. El Termcat només en té el sentit esportiu («gambada»), i el Softcatalà, el general («pas»)." }
"working set" = { ca = "—", motiu = "El conjunt de blocs o de pàgines que un programa fa servir en un interval de temps. Cap font no en té el terme." }
"loop tiling, loop blocking" = { ca = "—", motiu = "La transformació de bucles per blocs (L6). Cap font no en té el terme; «divisió en talls» i «tessel·lació» són d'altres sentits." }
"TLB shootdown" = { ca = "—", motiu = "La invalidació de les entrades del TLB dels altres nuclis (A8). Cap font no en té el terme." }
"fall-through" = { ca = "—", motiu = "El pas d'una clàusula `case` a la següent sense `break` (A3). Cap font no en té el terme." }
"round-robin" = { ca = "—", motiu = "La política de reemplaçament o de planificació per torns (A9). Cap font no en té el terme." }
"half" = { ca = "—", motiu = "El nom del format de coma flotant de 16 bits de l'IEEE 754 (P5, S5)." }
"doubleword" = { ca = "—", motiu = "El nom de la dada de 64 bits a l'especificació de RISC-V (A2)." }
"segfault" = { ca = "—", motiu = "El nom col·loquial de l'error de segmentació (*segmentation fault*, A2)." }

