# Glossari de termes (12_sigles_simbols.qmd §Termes): el que no surt del text (D-100).
#
# La forma catalana de cada terme anglès no és aquí: surt de la presentació al text,
# «**terme català** (*english*)», i 25_scripts/gen_glossari.py la recull. Aquí hi ha:
#   [observacions]  una nota per terme, a la columna «Observacions» de la taula; la clau
#                   és el terme anglès tal com surt a la columna «Anglès», en minúscules;
#   [en_angles]     els termes que el llibre manté en anglès, perquè el terme català no
#                   existeix o és molt poc usat (13_contrib.qmd §Anglicismes i
#                   terminologia obligatòria, D-88), amb la forma catalana, si n'hi ha,
#                   i el motiu.
#   [formes]        la forma de la taula quan no és la de la primera presentació: el
#                   singular d'una presentació en plural, o una forma decidida per l'usuari
#                   (D-108); la clau, com a [observacions];
#   [nombre]        `plural`, els termes que es mantenen en plural perquè gairebé no es fan
#                   servir en singular; `no_plural`, els que acaben en -s i són singulars.
# Un canvi en aquest fitxer demana regenerar el glossari: `make glossari`.

[nombre]
plural = ["precise exceptions"]
no_plural = ["miss", "tlb miss", "time sharing"]

[formes]
"alignment constraints" = { angles = "Alignment constraint", catala = "Restricció d'alineació" }
"arrays" = { angles = "Array", catala = "Vector" }
"branches" = { angles = "Branch", catala = "Salt condicional" }
"capacity" = { angles = "Capacity", catala = "Fallada de capacitat" }
"cold-start" = { angles = "Cold-start", catala = "Arrencada en fred" }   # decisió de l'usuari (60f61d0)
"compulsory" = { angles = "Compulsory", catala = "Obligatòria" }
"embedded systems" = { angles = "Embedded system", catala = "Sistema encastat" }
"escape sequences" = { angles = "Escape sequence", catala = "Seqüència d'escapament" }
"fields" = { angles = "Field", catala = "Camp" }
"full-adders" = { angles = "Full-adder", catala = "Sumador complet" }
"half-adders" = { angles = "Half-adder", catala = "Semisumador" }
"harts" = { angles = "Hart", catala = "Fil d'execució de maquinari" }
"jumps" = { angles = "Jump", catala = "Salt incondicional" }
"load/store" = { angles = "Load/store", catala = "Lectura/escriptura" }   # decisió de l'usuari (60f61d0)
"major page faults" = { angles = "Major page fault", catala = "Fallada major" }
"minor page faults" = { angles = "Minor page fault", catala = "Fallada menor" }
"page frames" = { angles = "Page frame", catala = "Marc de pàgina" }
"profiles" = { angles = "Profile", catala = "Perfil" }
"pseudoinstructions" = { angles = "Pseudoinstruction", catala = "Pseudoinstrucció" }
"subnormals" = { angles = "Subnormal", catala = "Denormal" }
"syscall" = { angles = "Syscall", catala = "Crida al sistema" }
"ways" = { angles = "Way", catala = "Via" }

[observacions]
"hardware" = "També l'abreviatura *HW*."
"software" = "També l'abreviatura *SW*."
"load" = "Les instruccions que llegeixen la memòria (`lw`, `flw`…) i la seva operació, també el verb (*llegir*). No ho és la càrrega d'immediats o d'adreces (`li`, `lui`, `la`), la del programa, la d'una pàgina ni la d'un bloc a l'MC."
"store" = "Les instruccions que escriuen la memòria (`sw`, `fsw`…) i la seva operació, també el verb (*escriure*). No ho és l'emmagatzematge com a disposició o com a suport (secundari, per files, *endianness*)."
"carry" = "Termcat."
"half-adders" = "Termcat."
"full-adders" = "Termcat."
"biased exponent" = "En el format IEEE 754. El valor numèric del biaix s'anomena «biaix», no «excés»; la codificació general és la codificació en excés (@sec-enters-en-exces)."
"aliasing" = "Grafia adaptada."
"multicore" = "Adjectiu invariable: «processador multinucli», «disseny multinucli». Termcat."
"padding" = "Termcat. El símbol `PAD` del codi es manté."
"string" = "O «cadena», si surt sovint."

[en_angles]
"pipeline" = { catala = "«canal» (Termcat)", motiu = "El terme català és molt poc usat en arquitectura de computadors, i es confon amb un canal de comunicació; el Termcat admet *pipeline* com a sinònim complementari. Només surt en un aprofundiment d'A9." }
"heap" = { catala = "«monticle» (Optimot)", motiu = "El terme català és molt poc usat, i a l'Optimot és de l'estructura de dades." }
"target" = { catala = "—", motiu = "No és a l'Optimot. A1 el glossa com «la màquina destí»." }
"caller, callee" = { catala = "«la funció que crida», «la funció cridada»", motiu = "Al text, la perífrasi catalana (taula de dalt); a les figures i a les columnes de les taules de registres, l'anglès, per l'espai." }
"caller-saved, callee-saved" = { catala = "—", motiu = "Termes de l'ABI." }
"sticky" = { catala = "—", motiu = "El bit S del sumador (G, R i S) i els indicadors de `fflags`: el Softcatalà només en dona el sentit general («enganxós»), i l'Optimot no en té cap terme." }
