# LanguageTool: el que és soroll per al llibre
#
# Configuració de 25_scripts/gramatica.py (make gramatica i make comprova-tot;
# 13_contrib.qmd §Comprovacions per nivells). Es manté a mà: una regla nova que
# només fa soroll s'hi desactiva amb el seu perquè, i una forma correcta que una
# regla activa marca hi va com a excepció. Les xifres no s'hi escriuen:
# `python3 25_scripts/gramatica.py --tot --resum` dona el compte per regla. D'on
# surt la primera versió (la passada de la fase 12 sobre 2a3d595), a D-105.
#
# Tres seccions:
#   [marcador]       com es reconeix una coincidència que només toca el marcador «X»
#                    (el que gramatica.py posa en lloc de les cursives, les sigles,
#                    les referències, les citacions, les imatges i el codi).
#   [[desactivada]]  regla de LanguageTool que al llibre només dona soroll: no es
#                    passa mai (--disable), i tampoc no en surten els casos bons.
#   [[excepcio]]     regla que es manté activa perquè també troba errors reals, amb
#                    formes que al llibre són correctes: s'ignora la coincidència si
#                    hi coincideixen tots els camps que porta l'excepció —`textos`
#                    (el text marcat, un de la llista), `fitxer` i `context` (un tros
#                    del text del voltant, o una llista de trossos)—. Amb `context`,
#                    l'excepció no amaga cap altre cas de la mateixa regla.
#
# Les paraules que hunspell no coneix no són aquí: van a 24_specs/diccionari.txt.

# ─── Marcador ──────────────────────────────────────────────────────────────
# El marcador «X» genera coincidències que no diuen res del text: 681 de les
# 1 829, sobretot «l'X» i «d'X» (L_NO_APOSTROFA, 373), «X X»
# (CATALAN_WORD_REPEAT_RULE, 266) i «X.» (MISSING_POINT, 20).
# No es desactiven les regles, que també troben errors reals: es descarta la
# coincidència quan el text marcat és només marcador, puntuació i xifres, o
# «l'X», «d'X», «s'X».
[marcador]
text = "X"
descarta = '''^(?:[\WX\d_]*|[lLdDsS]['’]X\w*|(?:\w+ )?X(?: X)+)$'''

# ─── Regles desactivades ───────────────────────────────────────────────────

[[desactivada]]
id = "MORFOLOGIK_RULE_CA_ES"
perque = "L'ortografia la fa ortografia.py, amb hunspell i el diccionari del projecte (24_specs/diccionari.txt), que LanguageTool no llegeix: a la prosa del llibre, quasi tot el que marca són termes anglesos en rodona, noms propis i mots tècnics."

[[desactivada]]
id = "UPPERCASE_SENTENCE_START"
perque = "Totes són la continuació d'una frase després d'una equació display o d'un bloc de codi («on $s$ és la mida…», «falla perquè…»), que l'extracció posa a l'inici de paràgraf, o una etiqueta de codi a l'inici d'un ítem."

[[desactivada]]
id = "EXIGEIX_VERBS_CENTRAL"
