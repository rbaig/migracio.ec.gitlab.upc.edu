rol   = "ra"
nom   = "ra"

# A3, @fig-ba-general: el BA en general, sense cap subrutina concreta.
[BA.T3_ba_general]
title  = "Estructura general del bloc d'activació"
desc   = "La pila, d'adreces baixes, amb sp a dalt, a adreces altes, amb quatre zones: les variables locals (tipus estructurats, i escalars sense registre disponible o dels quals es pren l'adreça amb &), en blau; l'alineació fins a un múltiple de 4, en gris; els registres segurs desats, de s0 a s11 els necessaris, si la subrutina és multinivell, en verd; i ra desat, si la subrutina és multinivell, en groc, a les adreces més altes."
escala = 20

[[BA.T3_ba_general.zones]]
tipus   = "generica"
rol     = "local"
bytes   = [2, 6, 1]
ratlles = "curtes"
text    = ["Variables locals", "tipus estructurats i escalars", "sense registre disponible o amb &"]

[[BA.T3_ba_general.zones]]
tipus = "alineacio"
bytes = 3
text  = "Alineació (múltiple de 4)"

[[BA.T3_ba_general.zones]]
tipus = "generica"
rol   = "segur"
bytes = [4, 4, 4]
text  = ["Registres segurs desats", "`s0`–`s11` (els necessaris)", "si la subrutina és multinivell"]

[[BA.T3_ba_general.zones]]
tipus = "escalar"
bytes = 4
rol   = "ra"
text  = ["`ra` desat", "si la subrutina és multinivell"]

