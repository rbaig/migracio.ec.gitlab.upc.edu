# mc.toml — Definicions de les figures de memòria cau (T7).
#
# Font de veritat de les figures `auto_figs/<nom>__MC_{light,dark}.svg`, que
# genera `25_scripts/gen_MC.py` al pre-render (`_quarto.yml`). El generador
# simula la MC sobre la seqüència d'accessos: els encerts, les fallades, el
# tipus de fallada, el bloc expulsat, el bit D i la via LRU surten de la
# simulació, no d'aquest fitxer.
#
# Format de cada figura:
#
#   [mc.<nom>]                     # nom del fitxer, sense sufix ni extensió
#   title, desc                    # <title> i <desc> de l'SVG (el <desc> és el text alternatiu)
#   estil       = "sequencia"      # "sequencia" (MP, accessos i MC a cada pas), "traca" (una fila per accés),
#                                  # "estat" (la MC després d'`inicial`, sense seqüència) o "lectura" (més avall)
#   adreca_bits = 8                # amplada de l'adreça; si n'hi ha, la MP mostra l'adreça en binari
#   bloc        = 4                # bytes per bloc
#   linies      = 2                # línies de la MC
#   vies        = 1                # 1: correspondència directa; = linies: completament associativa
#   escriptura  = "immediata"      # "immediata" o "retardada" (amb bit D)
#   assignacio  = true             # escriptura amb assignació o sense
#   unitat      = 1                # bytes per cel·la de dades (1: bytes; 4: paraules)
#   dades       = "bloc"           # una sola cel·la de dades per línia, amb el rang d'adreces del bloc
#   format_etiqueta = "hex"        # etiqueta en hexadecimal (0x…); per defecte, en binari
#   vectors     = [{nom="V", base=0, n=16, mida=4}]   # rètols de les cel·les (V[i]) en lloc de «byte k»
#   color       = "bloc"           # "bloc" (un color per bloc), "vector" (un color per vector) o "uniforme"
#   classifica  = false            # el resultat diu el tipus de fallada (obligatòria, de capacitat, de conflicte)
#   mp          = [[0, 2], [63, 63]]                 # rangs de blocs que es mostren a la MP
#   mostra_mp   = true             # estil "sequencia": columna de la MP
#   inicial     = [{op="L", adr=0}, …]               # accessos previs, que no es dibuixen
#   fila_inicial = true            # estil "traca": fila «Estat inicial» encara que no hi hagi accessos previs
#   fotogrames  = false            # també un SVG per pas (<nom>_pas<k>__MC), per a la figura dinàmica de l'HTML
#   accessos    = [{op="L", adr=0, grup="i = 0", nota="…"}, …]
#                                  # op: "L" (lectura) o "E" (escriptura); grup: rètol d'un grup d'accessos;
#                                  # nota: substitueix l'explicació automàtica del pas
#   ressalta_columna = "D"         # estil "estat": emmarca la columna del bit D
#   ubica       = 4                # estil "estat": una adreça; dibuixa també la MP i on pot anar el seu bloc
#
# Les seqüències són les d'A7 (§Exemples de les polítiques d'escriptura,
# #tip-lru-exemple, §Exemple: fallades de conflicte, §Exemple: fallades de
# capacitat). Els accessos d'un byte (`lb`/`sb`) dels exemples d'escriptura
# són els d'A7 des del 2026-10-04.

# ── Polítiques d'escriptura (A7 §Exemples): MC de 2 línies i blocs de 4 bytes ──

[mc.T7_escriptura_estat_inicial]
title = "Estat inicial de la memòria cau: seqüència de 5 lectures"
desc  = "MC de correspondència directa de 2 línies amb blocs de 4 bytes, inicialment buida. Lectures dels bytes 0, 2, 4, 6 i 8: fallada (bloc 0 a la línia 0), encert, fallada (bloc 1 a la línia 1), encert i fallada (el bloc 2 expulsa el bloc 0 de la línia 0). Al final, la línia 0 conté el bloc 2 i la línia 1, el bloc 1."
adreca_bits = 8
bloc = 4
linies = 2
mp = [[0, 2]]
fotogrames = true      # figura dinàmica a l'HTML
accessos = [{op="L", adr=0}, {op="L", adr=2}, {op="L", adr=4}, {op="L", adr=6}, {op="L", adr=8}]

[mc.T7_escriptura_estat_inicial_traca]
title = "Estat inicial de la memòria cau: seqüència de 5 lectures, en forma de traça"
desc  = "Taula amb una fila per lectura (bytes 0, 2, 4, 6 i 8): bloc, línia, resultat i el bloc que conté cada línia de la MC després de l'accés. Al final, la línia 0 conté el bloc 2 i la línia 1, el bloc 1."
estil = "traca"
adreca_bits = 8
bloc = 4
linies = 2
mp = [[0, 2]]
fila_inicial = true
accessos = [{op="L", adr=0}, {op="L", adr=2}, {op="L", adr=4}, {op="L", adr=6}, {op="L", adr=8}]

[mc.T7_escriptura_immediata_amb_assignacio]
title = "Escriptura immediata amb assignació: dues escriptures"
desc  = "Partint de l'estat inicial (línia 0: bloc 2; línia 1: bloc 1). Escriptura del byte 10: encert, s'escriu a la MC i a la MP. Escriptura del byte 252: fallada, es copia el bloc 63 a la línia 1 (expulsa el bloc 1) i s'escriu a la MC i a la MP."
adreca_bits = 8
bloc = 4
linies = 2
escriptura = "immediata"
assignacio = true
mp = [[0, 2], [63, 63]]
inicial = [{op="L", adr=0}, {op="L", adr=2}, {op="L", adr=4}, {op="L", adr=6}, {op="L", adr=8}]
fotogrames = true      # figura dinàmica a l'HTML
accessos = [{op="E", adr=10}, {op="E", adr=252}]

[mc.T7_escriptura_immediata_sense_assignacio]
title = "Escriptura immediata sense assignació: dues escriptures"
desc  = "Partint de l'estat inicial (línia 0: bloc 2; línia 1: bloc 1). Escriptura del byte 10: encert, s'escriu a la MC i a la MP. Escriptura del byte 252: fallada, s'escriu només a la MP i la MC no canvia."
adreca_bits = 8
bloc = 4
linies = 2
escriptura = "immediata"
assignacio = false
mp = [[0, 2], [63, 63]]
inicial = [{op="L", adr=0}, {op="L", adr=2}, {op="L", adr=4}, {op="L", adr=6}, {op="L", adr=8}]
fotogrames = true      # figura dinàmica a l'HTML
accessos = [{op="E", adr=10}, {op="E", adr=252}]

[mc.T7_escriptura_retardada]
title = "Escriptura retardada amb assignació: tres accessos"
desc  = "Partint de l'estat inicial amb D = 0 a les dues línies. Escriptura del byte 10: encert, s'escriu només a la MC i D passa a 1. Lectura del byte 0: fallada; el bloc 2 de la línia 0 és modificat i s'escriu a la MP abans de copiar-hi el bloc 0 (D = 0). Escriptura del byte 252: fallada; es copia el bloc 63 a la línia 1 (expulsa el bloc 1, no modificat) i s'hi escriu (D = 1)."
adreca_bits = 8
bloc = 4
linies = 2
escriptura = "retardada"
assignacio = true
mp = [[0, 2], [63, 63]]
inicial = [{op="L", adr=0}, {op="L", adr=2}, {op="L", adr=4}, {op="L", adr=6}, {op="L", adr=8}]
fotogrames = true      # figura dinàmica a l'HTML
accessos = [{op="E", adr=10}, {op="L", adr=0}, {op="E", adr=252}]

# ── LRU (A7 #tip-lru-exemple): 4 conjunts de 2 vies, blocs de 4 bytes ──

[mc.T7_lru_exemple]
title = "Reemplaçament LRU en una memòria cau associativa per conjunts de 2 vies"
desc  = "MC de 4 conjunts de 2 vies amb blocs de 4 bytes, inicialment buida. Lectures dels bytes 4, 38, 6 i 52, totes al conjunt 1: fallada (bloc 1 a la via 0), fallada (bloc 9 a la via 1; la via LRU passa a ser la 0), encert a la via 0 (la LRU passa a ser la 1) i fallada (el bloc 13 reemplaça el bloc 9 de la via 1, que era la LRU)."
adreca_bits = 8
bloc = 4
linies = 8
vies = 2
mostra_mp = false      # el text de cada accés ja diu el bloc i el conjunt; sense la MP, la figura és prou estreta per al PDF
fotogrames = true      # figura dinàmica a l'HTML
mp = [[1, 1], [9, 9], [13, 13]]
accessos = [{op="L", adr=4}, {op="L", adr=38}, {op="L", adr=6}, {op="L", adr=52}]

# ── Fallades de conflicte (A7 §Exemple: fallades de conflicte): 4 línies, blocs de 8 bytes ──

[mc.T7_conflicte_exemple]
title = "Fallades de conflicte en el recorregut paral·lel de dos vectors"
desc  = "Taula de traça dels 16 accessos de f(A, B) en una MC de correspondència directa de 4 línies amb blocs de 8 bytes. Per a cada i, A[i] i B[i] van a la mateixa línia amb etiquetes diferents i s'expulsen mútuament: a les i parelles, les dues lectures són fallades obligatòries; a les senars, fallades de conflicte. Els 16 accessos fallen."
estil = "traca"
bloc = 8
unitat = 4
linies = 4
classifica = true
color = "vector"
mp = [[0, 7]]
vectors = [{nom="A", base=0, n=8, mida=4}, {nom="B", base=32, n=8, mida=4}]
fotogrames = true      # figura dinàmica a l'HTML
accessos = [
  {op="L", adr=0,  grup="i = 0"}, {op="L", adr=32},
  {op="L", adr=4,  grup="i = 1"}, {op="L", adr=36},
  {op="L", adr=8,  grup="i = 2"}, {op="L", adr=40},
  {op="L", adr=12, grup="i = 3"}, {op="L", adr=44},
  {op="L", adr=16, grup="i = 4"}, {op="L", adr=48},
  {op="L", adr=20, grup="i = 5"}, {op="L", adr=52},
  {op="L", adr=24, grup="i = 6"}, {op="L", adr=56},
  {op="L", adr=28, grup="i = 7"}, {op="L", adr=60},
]

# ── Fallades de capacitat (A7 §Exemple: fallades de capacitat): completament associativa de 4 línies ──

[mc.T7_capacitat_exemple]
title = "Fallades de capacitat en una memòria cau completament associativa de 4 línies"
desc  = "Taula de traça de g(V) en una MC completament associativa de 4 línies, amb blocs de 8 bytes i reemplaçament LRU. Al primer bucle, els 8 blocs de V entren amb fallades obligatòries, una per bloc, i a partir del cinquè cada bloc expulsa el més antic. Al segon bucle, els blocs de V[0] a V[7] ja no hi són: cada bloc torna a fallar, ara amb una fallada de capacitat."
estil = "traca"
bloc = 8
unitat = 4
linies = 4
vies = 4
classifica = true
mp = [[0, 7]]
vectors = [{nom="V", base=0, n=16, mida=4}]
fotogrames = true      # figura dinàmica a l'HTML
accessos = [
  {op="L", adr=0, grup="Primer bucle"}, {op="L", adr=4}, {op="L", adr=8}, {op="L", adr=12},
  {op="L", adr=16}, {op="L", adr=20}, {op="L", adr=24}, {op="L", adr=28},
  {op="L", adr=32}, {op="L", adr=36}, {op="L", adr=40}, {op="L", adr=44},
  {op="L", adr=48}, {op="L", adr=52}, {op="L", adr=56}, {op="L", adr=60},
  {op="L", adr=0, grup="Segon bucle, de V[0] a V[7]"}, {op="L", adr=4}, {op="L", adr=8}, {op="L", adr=12},
  {op="L", adr=16}, {op="L", adr=20}, {op="L", adr=24}, {op="L", adr=28},
]

# ── Diagrames de blocs de la lectura (A7 §Polítiques d'emplaçament): estil "lectura" ──
# `organitzacio`: "directa", "conjunts" (N vies; se'n dibuixen la 0, la 1 i la N−1) o
# "completa" (un sol conjunt: cada línia és una via, sense índex ni descodificador).

[mc.T7_cd_diagrama]
title = "Lectura en una memòria cau de correspondència directa"
desc  = "L'adreça es parteix en etiqueta, índex i desplaçament. L'índex entra al descodificador, que selecciona una línia de la taula (V, etiqueta i dades). L'etiqueta guardada es compara amb la de l'adreça, i una porta AND amb el bit V dona el senyal d'encert. El desplaçament controla el multiplexor que tria la dada del bloc."
estil = "lectura"
organitzacio = "directa"
bloc = 16
linies = 8

[mc.T7_assoc_conjunts_diagrama]
title = "Lectura en una memòria cau associativa per conjunts de N vies"
desc  = "L'adreça es parteix en etiqueta, índex i desplaçament. L'índex entra al descodificador, que selecciona el mateix conjunt a les N vies, que es llegeixen en paral·lel. Cada via té el seu comparador d'etiquetes i la seva porta AND amb el bit V; una porta OR de les N sortides dona el senyal d'encert. Un multiplexor tria les dades de la via amb encert, i un altre, controlat pel desplaçament, la dada del bloc."
estil = "lectura"
organitzacio = "conjunts"
bloc = 16
linies = 8

[mc.T7_ca_diagrama]
title = "Lectura en una memòria cau completament associativa"
desc  = "L'adreça es parteix en etiqueta i desplaçament, sense índex ni descodificador. Cada línia, de la 0 a la N sub L menys 1, té el seu comparador d'etiquetes i la seva porta AND amb el bit V, i totes es comparen alhora; una porta OR dona el senyal d'encert. Un multiplexor tria les dades de la línia amb encert, i un altre, controlat pel desplaçament, la dada del bloc."
estil = "lectura"
organitzacio = "completa"
bloc = 16
linies = 8

# ── Taules d'organització (A7 §Organització, §Associativa per conjunts, §Polítiques d'escriptura): estil "estat" ──
# Les etiquetes de les dues primeres són les de #fig-mc-fallada, i la primera és la de #tip-mc-numbloc
# (A = 0x100100F8, B = 16). La MC és completament associativa perquè l'etiqueta hi sigui el número de bloc
# sencer: a §Organització, A7 encara no ha presentat les polítiques d'emplaçament.

[mc.T7_mc_organitzacio]
title = "Organització interna d'una memòria cau"
desc  = "Taula d'una memòria cau de 4 línies, numerades de 0 a 3, amb les columnes V, etiqueta i dades. Les línies 0, 1 i 2 són vàlides (V = 1): les etiquetes 0x100100F, 0x7FFFF01 i 0x1001010, i a les dades, els 16 bytes del bloc corresponent (per exemple, de 0x100100F0 a 0x100100FF). La línia 3 és buida (V = 0)."
estil = "estat"
adreca_bits = 32
bloc = 16
linies = 4
vies = 4
format_etiqueta = "hex"
dades = "bloc"
color = "uniforme"
inicial = [{op="L", adr=0x100100F8}, {op="L", adr=0x7FFFF010}, {op="L", adr=0x10010100}]

[mc.T7_assoc_conjunts_taula]
title = "On pot anar un bloc en una memòria cau associativa per conjunts de 3 vies"
desc  = "A dalt, el bloc 1 de la MP, bytes 4 a 7, amb les adreces en binari partides en etiqueta, índex i desplaçament; l'índex, 01, és emmarcat. A sota, la MC buida, de 4 conjunts amb 3 vies cadascun. Una línia porta de l'índex al conjunt 1, que és emmarcat, i tres fletxes van del bloc a cadascuna de les 3 vies."
estil = "estat"
adreca_bits = 8
bloc = 4
linies = 12
vies = 3
dades = "bloc"
mp = [[1, 1]]
ubica = 4

[mc.T7_escriptura_dirty_bit]
title = "Línies d'una memòria cau amb el bit de modificació D"
desc  = "La mateixa taula de 4 línies amb una columna més, D, emmarcada. Les línies 0 i 2 tenen D = 1 (el bloc s'ha modificat a la MC); la línia 1, D = 0; la línia 3 és buida (V = 0, D = 0)."
estil = "estat"
adreca_bits = 32
bloc = 16
linies = 4
vies = 4
escriptura = "retardada"
format_etiqueta = "hex"
dades = "bloc"
color = "uniforme"
ressalta_columna = "D"
inicial = [{op="E", adr=0x100100F8}, {op="L", adr=0x7FFFF010}, {op="E", adr=0x10010100}]
