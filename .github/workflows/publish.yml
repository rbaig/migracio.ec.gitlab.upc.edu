name: Publica a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # Permet llançar-ho manualment des de la pestanya Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clona el repositori
        uses: actions/checkout@v4

      # Habilita Pages i exposa la URL pública del lloc a `steps.pages.outputs.base_url`,
      # necessària per recuperar el PDF ja publicat en els pushos automàtics (vegeu més avall).
      - name: Configura GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instal·la Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # Els scripts de pre-render (25_scripts/*.py) només usen la llibreria
        # estàndard de Python (ast, re, sys, pathlib, colorsys, tomllib);
        # el runner ubuntu-latest ja porta Python 3.12+ preinstal·lat,
        # per tant no cal cap pas addicional d'instal·lació de dependències.

      # El motor de PDF només s'instal·la si es llança manualment (workflow_dispatch)
      - name: Instal·la TinyTeX (per a PDF)
        if: github.event_name == 'workflow_dispatch'
        run: quarto install tool tinytex
        
      # Les llibreries d'imatges només s'instal·len si es llança manualment
      - name: Instal·la llibreries per a imatges SVG
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Genera les taules fusionades (auto_riscv/)
        run: python3 25_scripts/gen_taules_auto.py 24_specs/taules_fusio.toml 21_riscv --output-dir="auto_riscv/"

      # Si és un push automàtic, només renderitza l'HTML per estalviar temps (segons).
      # Si és un llançament manual, renderitza tots els formats (HTML i PDF, ~7 minuts).
      - name: Renderitza el llibre
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            quarto render
          else
            quarto render --to html
          fi

      # El PDF només es renderitza en els dispatch manuals (~7 min). En els pushos
      # automàtics (HTML-only) el `_book/` es genera net i sense PDF; com que el
      # desplegament substitueix el lloc sencer, el PDF publicat es perdria. Per
      # evitar-ho, es recupera el PDF ja publicat del lloc en viu i es diposita a
      # `_book/` abans de pujar l'artefacte. Si encara no n'hi ha cap (primer
      # desplegament, «bootstrap»), es continua sense PDF sense trencar el build.
      - name: Recupera el PDF publicat (només en push automàtic)
        if: github.event_name != 'workflow_dispatch'
        run: |
          url="${{ steps.pages.outputs.base_url }}/Estructura-de-computadors.pdf"
          echo "Recuperant el PDF publicat de: $url"
          if curl -fsSL "$url" -o _book/Estructura-de-computadors.pdf; then
            echo "PDF recuperat correctament."
          else
            echo "No hi ha PDF previ publicat (bootstrap) o la baixada ha fallat; es continua sense PDF."
            rm -f _book/Estructura-de-computadors.pdf
          fi

      - name: Puja l'artefacte de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplega a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
